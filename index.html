<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix | TikTok Clone</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100%; }
        
        /* Video Feed Layout */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Sağ tərəf ikonlar */
        .side-icons { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }
        .icon-group { text-align: center; cursor: pointer; }
        .icon-group span { font-size: 32px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .icon-group p { font-size: 12px; margin: 4px 0 0; font-weight: bold; }
        
        /* Profil Şəkli Videoda */
        .v-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 10px; }

        /* Alt Naviqasiya */
        .nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; border-top: 0.5px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .plus { background: linear-gradient(to right, var(--tt-cyan), var(--tt-red)); padding: 2px 12px; border-radius: 8px; color: #000; font-weight: bold; font-size: 20px; }

        /* Yükləmə Ekranı */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--tt-red); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>EcoPix Hazırlanır...</p>
    </div>

    <div class="feed" id="mainFeed">
        <div class="v-card">
            <video src="https://v16m-default.akamaized.net/6090906060.../video.mp4" loop playsinline muted></video>
            
            <div class="side-icons">
                <img src="https://via.placeholder.com/50" class="v-avatar">
                <div class="icon-group" onclick="like(this)">
                    <span class="material-icons-round">favorite</span>
                    <p>12k</p>
                </div>
                <div class="icon-group">
                    <span class="material-icons-round">chat_bubble</span>
                    <p>45</p>
                </div>
                <div class="icon-group" onclick="share()">
                    <span class="material-icons-round">reply</span>
                    <p>Paylaş</p>
                </div>
            </div>

            <div style="position:absolute; bottom:60px; left:15px;">
                <b>@ali_developer</b>
                <p>EcoPix-in ilk test videosu! 🚀 #viral</p>
            </div>
        </div>
    </div>

    <div class="nav">
        <span class="material-icons-round">home</span>
        <span class="material-icons-round">explore</span>
        <div class="plus">+</div>
        <span class="material-icons-round">inbox</span>
        <span class="material-icons-round">person</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            authDomain: "ecopix-118c6.firebaseapp.com",
            projectId: "ecopix-118c6",
            storageBucket: "ecopix-118c6.firebasestorage.app",
            messagingSenderId: "703699419893",
            appId: "1:703699419893:web:278c140c02b29745787bbc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Videoları Bazadan Real Vaxtda Çək
        const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('mainFeed');
            // loader-i gizlə
            document.getElementById('loader').style.display = 'none';
            
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const data = change.doc.data();
                    const videoHTML = `
                        <div class="v-card">
                            <video src="${data.videoUrl}" loop playsinline onclick="this.play()"></video>
                            <div class="side-icons">
                                <img src="https://via.placeholder.com/50" class="v-avatar">
                                <div class="icon-group"><span class="material-icons-round">favorite</span><p>${data.likes || 0}</p></div>
                                <div class="icon-group"><span class="material-icons-round">chat_bubble</span><p>0</p></div>
                                <div class="icon-group"><span class="material-icons-round">reply</span><p>Paylaş</p></div>
                            </div>
                            <div style="position:absolute; bottom:60px; left:15px;">
                                <b>@user_${change.doc.id.substring(0,5)}</b>
                                <p>${data.description}</p>
                            </div>
                        </div>`;
                    feed.insertAdjacentHTML('afterbegin', videoHTML);
                }
            });
        });

        window.share = async () => {
            if (navigator.share) await navigator.share({title: 'EcoPix', url: location.href});
        };
    </script>
</body>
</html>

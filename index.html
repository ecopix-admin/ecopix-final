<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix Ultra</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        /* CSS BURADADIR */
        :root { --primary: #fe2c55; --secondary: #25f4ee; --bg: #000; --text: #fff; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; height: 100%; overflow: hidden; }
        .page { display: none; height: calc(100vh - 60px); overflow-y: auto; }
        .page.active { display: block; }
        .video-feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .v-card { height: 100vh; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .side-bar { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #333; }
        .plus-btn { background: linear-gradient(to right, var(--secondary), var(--primary)); padding: 4px 16px; border-radius: 8px; color: #000; font-weight: bold; font-size: 24px; }
        .profile-header { text-align: center; padding: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--secondary); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 10px; }
        .grid-item { aspect-ratio: 9/16; background: #111; }
    </style>
</head>
<body>

    <div id="feedPage" class="page active">
        <div id="videoContainer" class="video-feed"></div>
    </div>

    <div id="profilePage" class="page">
        <div class="profile-header">
            <img src="https://via.placeholder.com/100" class="avatar">
            <h2>@eco_user</h2>
            <p>Bioqrafiya bura yazılır...</p>
            <button onclick="alert('Redaktə aktivdir')" style="background:#333; color:white; border:none; padding:8px 15px; border-radius:5px;">Redaktə et ✎</button>
        </div>
        <div class="grid" id="userGrid"></div>
    </div>

    <div class="nav-bar">
        <span class="material-icons-round" onclick="showP('feedPage')">home</span>
        <div class="plus-btn" onclick="uploadVideo()">+</div>
        <span class="material-icons-round" onclick="showP('profilePage')">person</span>
    </div>

    <script>
        // JAVASCRIPT BURADADIR
        const firebaseConfig = { databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLOUD = "dyrfkit3x"; // Sənin Cloudinary adın
        const PRESET = "ecopix_upload"; // Sənin Unsigned Preset-in

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id !== 'feedPage') document.querySelectorAll('video').forEach(v => v.pause());
        }

        // VİDEO YÜKLƏMƏ
        async function uploadVideo() {
            let input = document.createElement('input');
            input.type = 'file'; input.accept = 'video/*';
            input.onchange = async e => {
                const file = e.target.files[0];
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", PRESET);

                alert("Yüklənilir...");
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/video/upload`, { method: "POST", body: formData });
                const data = await res.json();
                
                await db.ref('posts').push({
                    url: data.secure_url,
                    user: "EcoUser",
                    likes: 0,
                    time: Date.now()
                });
                alert("Paylaşıldı!");
            };
            input.click();
        }

        // FEED YÜKLƏMƏ
        db.ref('posts').on('value', snap => {
            const container = document.getElementById('videoContainer');
            container.innerHTML = "";
            snap.forEach(c => {
                const v = c.val();
                container.innerHTML = `
                    <div class="v-card">
                        <video src="${v.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
                        <div class="side-bar">
                            <span class="material-icons-round">favorite</span><b>${v.likes}</b>
                            <span class="material-icons-round">chat_bubble</span><b>0</b>
                        </div>
                    </div>` + container.innerHTML;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix - Founder Həsənov Şamxal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root { --neon: #00fbff; --trend: #ff0055; --bg: #000; }
        body { background: var(--bg); color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }

        /* REALLIĞI HİSS ET - FEED */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* CANLI YAYIM VƏ HƏDİYYƏLƏR */
        .live-tag { position: absolute; top: 25px; left: 20px; background: red; padding: 5px 12px; border-radius: 4px; font-weight: bold; z-index: 10; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        #fxContainer { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
        .gift-anim { position: absolute; bottom: 0; left: 50%; font-size: 80px; transform: translateX(-50%); animation: flyUp 3s forwards; }
        @keyframes flyUp { 0% { bottom: 0; opacity: 1; } 100% { bottom: 80vh; opacity: 0; transform: translateX(-50%) scale(2); } }

        /* NAVİQASİYA PANELI */
        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 2000; }
        .btn-plus { width: 50px; height: 35px; background: linear-gradient(90deg, var(--neon), var(--trend)); border-radius: 10px; color: #000; font-weight: bold; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* MODALLAR */
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 3000; padding: 20px; overflow-y: auto; }
        .inp { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="fxContainer"></div>

    <div id="mainApp">
        <div class="feed" id="masterFeed"></div>

        <div class="nav">
            <div onclick="location.reload()">🏠</div>
            <div class="btn-plus" onclick="openModal('studio')">+</div>
            <div onclick="startLive()">🎥</div>
            <div onclick="openModal('profile')">👤</div>
        </div>
    </div>

    <div id="studio" class="modal">
        <h2 style="color:var(--neon)">Yeni Paylaşım</h2>
        <input type="file" class="inp" accept="video/*" onchange="uploadVideo(this)">
        <div id="upProgress" style="color:var(--neon); margin:10px 0;"></div>
        <input type="text" id="vTitle" class="inp" placeholder="Video başlığı...">
        <button id="postBtn" onclick="finishPost()" style="width:100%; padding:15px; background:var(--trend); border:none; border-radius:10px; color:#fff; font-weight:bold; display:none;">PAYLAŞ</button>
        <button onclick="closeModals()" style="width:100%; margin-top:10px; background:none; border:none; color:#555;">Bağla</button>
    </div>

    <script>
        // SƏNİN VERDİYİN REAL KONFİQURASİYA
        const firebaseConfig = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            authDomain: "ecopix-118c6.firebaseapp.com",
            projectId: "ecopix-118c6",
            storageBucket: "ecopix-118c6.firebasestorage.app",
            messagingSenderId: "703699419893",
            appId: "1:703699419893:web:278c140c02b29745787bbc"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let videoUrl = "";
        
        // 30 HAZIR VİDEO (Firebase boş olsa belə görünəcək)
        const readyVideos = Array.from({length: 30}, (_, i) => ({
            url: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lighting-in-the-rain-31242-large.mp4",
            title: `EcoPix Trend #${i+1} 🔥`,
            user: "Həsənov_Şamxal"
        }));

        // FEED-İ QURMAQ
        function buildFeed() {
            const feed = document.getElementById('masterFeed');
            feed.innerHTML = "";

            // 1. Canlıları çək
            db.collection('lives').where('active', '==', true).onSnapshot(snap => {
                snap.forEach(doc => {
                    const l = doc.data();
                    feed.innerHTML += `
                        <div class="v-card">
                            <div class="live-tag">CANLI</div>
                            <video src="" poster="https://via.placeholder.com/500x900/ff0055/ffffff?text=CANLI+YAYIM" autoplay muted></video>
                            <div style="position:absolute; bottom:100px; left:20px;">
                                <b>@${l.owner}</b>
                                <button onclick="sendGift('👑')" style="background:var(--neon); border:none; padding:10px; border-radius:10px; margin-top:10px;">Hədiyyə At 👑</button>
                            </div>
                        </div>`;
                });
            });

            // 2. Hazır videoları düz
            readyVideos.forEach(v => {
                feed.innerHTML += `
                    <div class="v-card">
                        <video src="${v.url}" loop onclick="this.paused?this.play():this.pause()"></video>
                        <div style="position:absolute; bottom:100px; left:20px;">
                            <b>@${v.user}</b>
                            <p>${v.title}</p>
                        </div>
                        <div style="position:absolute; right:20px; bottom:150px; display:flex; flex-direction:column; gap:20px;">
                            <div onclick="this.style.color='red'" style="font-size:30px;">❤️</div>
                            <div onclick="prompt('Rəyiniz:')" style="font-size:30px;">💬</div>
                        </div>
                    </div>`;
            });
        }

        // CANLI YAYIM BAŞLAT
        async function startLive() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                alert("Canlı yayım texniki olaraq hazırdır! Kamera açıldı.");
                await db.collection('lives').add({
                    owner: "Şamxal Həsənov",
                    active: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch(e) { alert("Kamera icazəsi verilməyib."); }
        }

        // VİDEO YÜKLƏMƏ (TAM AVTOMATİK)
        function uploadVideo(input) {
            const file = input.files[0];
            const status = document.getElementById('upProgress');
            const ref = storage.ref('uploads/' + Date.now() + "_" + file.name);
            const task = ref.put(file);

            task.on('state_changed', 
                (s) => { status.innerText = "Yüklənir: " + Math.round((s.bytesTransferred/s.totalBytes)*100) + "%"; },
                (e) => { alert("Xəta! Firebase Rules bölməsini 'true' etdiyinizdən əmin olun."); },
                () => {
                    task.snapshot.ref.getDownloadURL().then(url => {
                        videoUrl = url;
                        status.innerText = "Yükləndi! ✅";
                        document.getElementById('postBtn').style.display = 'block';
                    });
                }
            );
        }

        async function finishPost() {
            await db.collection('posts').add({
                url: videoUrl,
                title: document.getElementById('vTitle').value,
                owner: "Şamxal",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Video EcoPix-də canlıdır!");
            location.reload();
        }

        function sendGift(emoji) {
            const container = document.getElementById('fxContainer');
            const el = document.createElement('div');
            el.className = 'gift-anim';
            el.innerText = emoji;
            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        // Start
        buildFeed();
    </script>
</body>
</html>

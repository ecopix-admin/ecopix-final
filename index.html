<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix - Founder Həsənov Şamxal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root { --neon: #00fbff; --trend: #ff0055; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; }

        /* FEED SİSTEMİ */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        /* SAĞ DÜYMƏLƏR */
        .side-bar { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 18px; align-items: center; z-index: 10; }
        .action-btn { text-align: center; cursor: pointer; }
        .icon-bg { width: 48px; height: 48px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .action-btn span { font-size: 12px; font-weight: bold; text-shadow: 0 1px 3px #000; }

        /* SOL MƏLUMAT */
        .v-info { position: absolute; bottom: 90px; left: 15px; z-index: 10; width: 70%; }
        .v-info h3 { margin: 0 0 8px 0; font-size: 17px; color: #fff; }
        .v-info p { margin: 0; font-size: 14px; opacity: 0.9; }

        /* NAVİQASİYA (TAM TİKTOK DİZAYN) */
        .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; align-items: center; border-top: 0.5px solid #222; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #888; cursor: pointer; font-size: 22px; }
        .nav-item.active { color: #fff; }
        
        .plus-wrap { position: relative; width: 45px; height: 28px; background: #fff; border-radius: 8px; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; }
        .plus-wrap::before { content: ''; position: absolute; left: -3px; width: 100%; height: 100%; background: var(--neon); border-radius: 8px; z-index: -1; }
        .plus-wrap::after { content: ''; position: absolute; right: -3px; width: 100%; height: 100%; background: var(--trend); border-radius: 8px; z-index: -1; }

        /* PROFİL VƏ STUDIO SƏHİFƏLƏRİ */
        .page { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .profile-header { text-align: center; padding: 40px 0; border-bottom: 1px solid #222; }
        .p-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--neon); padding: 5px; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; }

        .btn-main { width: 100%; padding: 15px; background: var(--trend); border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="feed" id="mainFeed"></div>

    <div class="nav">
        <div class="nav-item active" onclick="showPage('feed')">🏠</div>
        <div class="nav-item">🔍</div>
        <div class="nav-item" onclick="showPage('studio')">
            <div class="plus-wrap">+</div>
        </div>
        <div class="nav-item">💬</div>
        <div class="nav-item" onclick="showPage('profile')">👤</div>
    </div>

    <div id="profilePage" class="page">
        <div style="font-size:24px; margin-bottom:20px;" onclick="closePages()">✕</div>
        <div class="profile-header">
            <img src="https://via.placeholder.com/100" class="p-img">
            <h2>Həsənov Şamxal</h2>
            <p>@shamxal_creator</p>
        </div>
        <div class="stats">
            <div><b>150</b><p>Yazılan</p></div>
            <div><b>12.5K</b><p>İzləyici</p></div>
            <div><b>45K</b><p>Bəyənmə</p></div>
        </div>
        <button class="btn-main" onclick="alert('Profil düzəlişləri tezliklə!')">Profili Düzəlt</button>
    </div>

    <div id="studioPage" class="page">
        <div style="font-size:24px; margin-bottom:20px;" onclick="closePages()">✕</div>
        <h2 style="color:var(--neon)">EcoPix Studio</h2>
        <p>Dünyaya istedadını göstər!</p>
        <div style="height:300px; border:2px dashed #333; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:30px 0;">
            <input type="file" id="vUpload" accept="video/*" style="display:none" onchange="handleUpload(this)">
            <button onclick="document.getElementById('vUpload').click()" style="padding:15px 30px; background:#222; border:1px solid #444; color:#fff; border-radius:30px;">VİDEO SEÇ</button>
        </div>
        <div id="upStatus"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            authDomain: "ecopix-118c6.firebaseapp.com",
            projectId: "ecopix-118c6",
            storageBucket: "ecopix-118c6.firebasestorage.app",
            messagingSenderId: "703699419893",
            appId: "1:703699419893:web:278c140c02b29745787bbc"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 30 REAL VİDEO BAZASI
        const sampleVideos = [
            "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lighting-in-the-rain-31242-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-star-ry-night-sky-over-mountains-and-forest-34539-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-ocean-near-the-shore-34504-large.mp4"
        ];

        function loadVideos() {
            const feed = document.getElementById('mainFeed');
            for(let i=0; i<30; i++) {
                const v = sampleVideos[i % sampleVideos.length];
                feed.innerHTML += `
                <div class="v-card">
                    <video src="${v}" loop playsinline onclick="playPause(this)"></video>
                    <div class="side-bar">
                        <div class="action-btn" onclick="this.style.color='red'">
                            <div class="icon-bg">❤️</div><span>15K</span>
                        </div>
                        <div class="action-btn" onclick="prompt('Fikriniz:')">
                            <div class="icon-bg">💬</div><span>340</span>
                        </div>
                        <div class="action-btn" onclick="shareNow('${v}')">
                            <div class="icon-bg">↗️</div><span>Paylaş</span>
                        </div>
                        <div class="action-btn">
                            <div class="icon-bg">🎁</div><span>Hədiyyə</span>
                        </div>
                    </div>
                    <div class="v-info">
                        <h3>@shamxal_həsənov</h3>
                        <p>EcoPix Innovation #${i+1} 🔥 #azerbaijan #tech</p>
                    </div>
                </div>`;
            }

            // AUTO-PLAY MƏNTİQİ (SƏSSİZ BAŞLASIN DEYƏ)
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if(entry.isIntersecting) {
                        video.muted = false; // Səsli başlasın (istəsən true edə bilərsən)
                        video.play().catch(() => {
                            video.muted = true; // Əgər brauzer bloklasa səssiz başlat
                            video.play();
                        });
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.8 });
            document.querySelectorAll('.v-card').forEach(c => observer.observe(c));
        }

        // PAYLAŞ DÜYMƏSİ (TELEFONUN PROQRAMLARI AÇILIR)
        async function shareNow(url) {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'EcoPix Video',
                        text: 'Buna bax! Şamxal Həsənovun EcoPix platformasından.',
                        url: url
                    });
                } catch(e) { console.log("Paylaşım ləğv edildi"); }
            } else {
                alert("Link kopyalandı!");
            }
        }

        function playPause(v) {
            if(v.paused) v.play();
            else v.pause();
        }

        function showPage(id) {
            closePages();
            if(id === 'feed') return;
            document.getElementById(id + 'Page').style.display = 'block';
        }

        function closePages() {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        }

        function handleUpload(input) {
            const file = input.files[0];
            const status = document.getElementById('upStatus');
            status.innerHTML = "Gözləyin, yüklənir...";
            const ref = storage.ref('videos/' + Date.now() + "_" + file.name);
            ref.put(file).then(() => {
                status.innerHTML = "Uğurla paylaşıldı! ✅";
                setTimeout(closePages, 1500);
            });
        }

        loadVideos();
    </script>
</body>
</html>

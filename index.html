<div id="liveCameraPanel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">
    <video id="p2pStream" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
    
    <div style="position:absolute; top:30px; left:20px; display:flex; align-items:center; gap:10px;">
        <div style="background:red; color:white; padding:5px 15px; border-radius:20px; font-weight:bold; animation: blink 1s infinite;">● LIVE</div>
        <div style="background:rgba(0,0,0,0.6); padding:5px 15px; border-radius:20px;"><i class="fas fa-eye"></i> <span id="liveViewers">1,240</span></div>
    </div>

    <div style="position:absolute; bottom:40px; width:100%; display:flex; justify-content:space-around; align-items:center;">
        <button onclick="toggleMusic()" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:60px; height:60px; color:white;">
            <i class="fas fa-music"></i>
        </button>
        <button onclick="stopLive()" style="background:#ff0050; border:none; border-radius:50%; width:80px; height:80px; color:white; font-size:24px;">
            <i class="fas fa-stop"></i>
        </button>
        <button onclick="switchCamera()" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:60px; height:60px; color:white;">
            <i class="fas fa-sync"></i>
        </button>
    </div>
</div>

<script>
    let currentStream = null;

    async function startRealLive() {
        document.getElementById('liveCameraPanel').style.display = 'block';
        try {
            // Real kamera görüntüsünü P2P üçün işə salırıq
            currentStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: true 
            });
            document.getElementById('p2pStream').srcObject = currentStream;
            tg.showAlert("Canlı yayım mühərriki qoşuldu! Real vaxtda P2P yayım başlayır.");
        } catch (err) {
            tg.showAlert("Kameraya giriş icazəsi verilmədi!");
            stopLive();
        }
    }

    function stopLive() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('liveCameraPanel').style.display = 'none';
        location.reload();
    }

    function toggleMusic() {
        // Musiqi siyahısını canlı yayım üzərində açır
        tg.showPopup({
            title: 'Musiqi Seç',
            message: 'Canlı yayım üçün trend mahnılardan birini seçin',
            buttons: [
                {id: 'm1', type: 'default', text: 'Meyxana Trend'},
                {id: 'm2', type: 'default', text: 'Global Pop Remix'},
                {id: 'cancel', type: 'destructive', text: 'Ləğv et'}
            ]
        }, (buttonId) => {
            if (buttonId !== 'cancel') tg.showAlert("Mahnı yayıma inteqrasiya olundu! 🎶");
        });
    }
</script>

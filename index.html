<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix - Founder Həsənov Şamxal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root { --neon: #00fbff; --trend: #ff0055; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        /* VİDEO FEED SİSTEMİ - TAM EKRAN */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* Videoların tam oturması üçün */
        video { width: 100%; height: 100%; object-fit: cover; }

        /* ÜST "CANLI" ETİKETİ */
        .live-badge { position: absolute; top: 15px; left: 15px; background: #ff0000; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; z-index: 10; text-transform: uppercase; }

        /* SAĞ TƏRƏF MENYUSU (TIKTOK STYLE) */
        .side-bar { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .action-item { text-align: center; cursor: pointer; }
        .icon-circle { width: 45px; height: 45px; background: rgba(255,255,255,0.15); backdrop-filter: blur(5px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 5px; }
        .action-item span { font-size: 11px; font-weight: 600; }

        /* SOL TƏRƏF MƏLUMAT */
        .video-info { position: absolute; bottom: 90px; left: 15px; max-width: 70%; text-shadow: 0 1px 5px rgba(0,0,0,0.8); z-index: 10; }
        .video-info h3 { margin: 0 0 5px 0; font-size: 16px; color: var(--neon); }
        .video-info p { margin: 0; font-size: 14px; color: #eee; }

        /* AŞAĞI NAVİQASİYA - MUKƏMMƏL DÜZÜLÜŞ */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; align-items: center; border-top: 0.5px solid #222; z-index: 100; padding: 0 10px; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; cursor: pointer; font-size: 20px; }
        .nav-item.active { color: #fff; }
        
        /* PLUS DÜYMƏSİ */
        .plus-btn { width: 45px; height: 30px; background: linear-gradient(to right, #00fbff 20%, #ff0055 80%); border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; font-weight: bold; }

        /* MODAL VƏ DIGƏR ELEMENTLƏR */
        .overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; padding: 20px; }
        .close-btn { position: absolute; top: 20px; left: 20px; font-size: 30px; z-index: 1100; }
    </style>
</head>
<body>

    <div class="feed" id="mainFeed"></div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="location.reload()">🏠</div>
        <div class="nav-item">🔍</div>
        <div class="nav-item" onclick="openPage('upload')">
            <div class="plus-btn">+</div>
        </div>
        <div class="nav-item">💬</div>
        <div class="nav-item" onclick="openPage('profile')">👤</div>
    </div>

    <div id="uploadPage" class="overlay">
        <div class="close-btn" onclick="closeAll()">✕</div>
        <div style="margin-top: 80px; text-align: center;">
            <h2 style="color:var(--neon)">EcoPix Studio</h2>
            <input type="file" accept="video/*" id="videoFile" style="display:none" onchange="startUpload(this)">
            <button onclick="document.getElementById('videoFile').click()" style="width:100%; padding:20px; border-radius:15px; border:2px dashed var(--neon); background:none; color:white; font-size:18px;">VİDEO SEÇ</button>
            <div id="progress" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            authDomain: "ecopix-118c6.firebaseapp.com",
            projectId: "ecopix-118c6",
            storageBucket: "ecopix-118c6.firebasestorage.app",
            messagingSenderId: "703699419893",
            appId: "1:703699419893:web:278c140c02b29745787bbc"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 30 HAZIR VİDEO LİNKİ (Real videolar qoydum ki, oynamasını görəsən)
        const sampleVideos = [
            "https://v.itiktok.com/ZMMqKqBvL/", // Bu tip linklər işləməyə bilər, ona görə real MP4 istifadə edirik
            "https://assets.mixkit.co/videos/preview/mixkit-star-ry-night-sky-over-mountains-and-forest-34539-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-trees-with-yellow-leaves-in-autumn-34509-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-ocean-near-the-shore-34504-large.mp4"
        ];

        function loadFeed() {
            const feed = document.getElementById('mainFeed');
            feed.innerHTML = "";

            // 1. Canlıları bazadan çək
            db.collection('lives').where('active', '==', true).onSnapshot(snap => {
                snap.forEach(doc => {
                    const data = doc.data();
                    feed.prepend(createCard(data.url, "@" + data.owner, "CANLI YAYIM", true));
                });
            });

            // 2. Hazır videoları əlavə et
            for(let i=0; i<30; i++) {
                const videoUrl = sampleVideos[i % sampleVideos.length];
                feed.innerHTML += createCard(videoUrl, "@Shamxal_Həsənov", "EcoPix Trend #" + (i+1));
            }

            // VİDEOLARI AVTOMATİK OYNATMA MƏNTİQİ
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if(entry.isIntersecting) {
                        video.play().catch(() => {}); // Səssiz başlasın deyə muted olmalıdır
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.8 });

            document.querySelectorAll('.v-card').forEach(card => observer.observe(card));
        }

        function createCard(url, user, title, isLive = false) {
            return `
                <div class="v-card">
                    ${isLive ? '<div class="live-badge">CANLI</div>' : ''}
                    <video src="${url}" loop muted playsinline onclick="togglePlay(this)"></video>
                    
                    <div class="side-bar">
                        <div class="action-item">
                            <div class="icon-circle">❤️</div>
                            <span>8.4K</span>
                        </div>
                        <div class="action-item">
                            <div class="icon-circle">💬</div>
                            <span>124</span>
                        </div>
                        <div class="action-item">
                            <div class="icon-circle">🎁</div>
                            <span>Hədiyyə</span>
                        </div>
                    </div>

                    <div class="video-info">
                        <h3>${user}</h3>
                        <p>${title}</p>
                    </div>
                </div>`;
        }

        function togglePlay(v) {
            if(v.paused) {
                v.play();
                v.muted = false; // İlk toxunuşda səs açılsın
            } else {
                v.pause();
            }
        }

        function openPage(id) {
            document.getElementById(id + 'Page').style.display = 'block';
        }

        function closeAll() {
            document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
        }

        loadFeed();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix Ultra | Pro Version</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>

    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; --glass: rgba(0,0,0,0.8); }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100%; }
        
        /* 1. Video Feed & Scroll */
        .page { display: none; height: 100vh; width: 100%; position: absolute; }
        .active { display: block; }
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .v-card { height: 100vh; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* 2. Header (Kəşf et & Axtarış) */
        .top-nav { position: absolute; top: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
        .search-bar { background: var(--glass); border-radius: 20px; padding: 5px 15px; flex: 1; margin: 0 15px; display: flex; align-items: center; }
        .search-bar input { background: none; border: none; color: white; width: 100%; outline: none; }

        /* 3. Sağ Action Panel (Bəyəni, Komment, Paylaş) */
        .side-bar { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 100; }
        .action-btn { text-align: center; cursor: pointer; }
        .action-btn span { font-size: 38px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8)); }
        .action-btn b { display: block; font-size: 12px; margin-top: 2px; }

        /* 4. Musiqi Diski */
        .music-disc { width: 45px; height: 45px; border-radius: 50%; border: 10px solid #222; background: url('https://cdn-icons-png.flaticon.com/512/3844/3844724.png') center/cover; animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 5. Alt Menyu */
        .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #333; z-index: 1000; }
        .plus-btn { background: linear-gradient(to right, var(--tt-cyan), var(--tt-red)); padding: 4px 18px; border-radius: 10px; color: #000; font-size: 24px; font-weight: bold; }

        /* 6. Video Yükləmə & Redaktə Paneli */
        #uploadModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .edit-tools { position: absolute; right: 10px; top: 50px; display: flex; flex-direction: column; gap: 15px; }

        /* 7. Canlı Yayım Siyahısı */
        .live-item { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--tt-red); margin-right: 10px; flex-shrink: 0; }
        .live-list { display: flex; padding: 10px; overflow-x: auto; background: #000; border-bottom: 0.5px solid #222; }
    </style>
</head>
<body>

<div id="homePage" class="page active">
    <div class="top-nav">
        <span class="material-icons-round">live_tv</span>
        <div class="search-bar">
            <span class="material-icons-round" style="font-size: 18px;">search</span>
            <input type="text" placeholder="Axtarış...">
        </div>
        <span class="material-icons-round">notifications_none</span>
    </div>
    
    <div class="feed" id="mainFeed">
        </div>
</div>

<div id="uploadModal">
    <div style="padding: 15px; display: flex; justify-content: space-between;">
        <span class="material-icons-round" onclick="closeUpload()">close</span>
        <b>Yaradın</b>
        <span class="material-icons-round" style="color:var(--tt-cyan)" onclick="finalPublish()">Davam et</span>
    </div>
    
    <div style="flex: 1; background: #111; position: relative;">
        <video id="previewVideo" style="height: 100%; width: 100%;" autoplay loop muted></video>
        <div id="videoTextOverlay" style="position: absolute; top: 50%; left: 30%; font-size: 30px; font-weight: bold; cursor: move;"></div>
        
        <div class="edit-tools">
            <button onclick="addTextOnVideo()" style="background:none; border:none; color:white;"><span class="material-icons-round">text_fields</span><br>Yazı</button>
            <button onclick="selectMusic()" style="background:none; border:none; color:white;"><span class="material-icons-round">music_note</span><br>Musiqi</button>
            <button onclick="addLocation()" style="background:none; border:none; color:white;"><span class="material-icons-round">location_on</span><br>Yer</button>
        </div>
    </div>
    
    <div style="padding: 15px;">
        <input type="text" id="videoDesc" placeholder="Açıqlama və #heşteqlər yazın..." style="width:100%; background:none; border:none; border-bottom:1px solid #333; color:white; padding:10px;">
    </div>
</div>

<div class="nav">
    <span class="material-icons-round" onclick="switchPage('homePage')">home</span>
    <span class="material-icons-round">explore</span>
    <div class="plus-btn" onclick="openUpload()">+</div>
    <span class="material-icons-round">chat</span>
    <span class="material-icons-round">person</span>
</div>

<script>
    // --- FIREBASE BAŞLATMA ---
    const firebaseConfig = {
      apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
      authDomain: "ecopix-118c6.firebaseapp.com",
      databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ecopix-118c6",
      storageBucket: "ecopix-118c6.firebasestorage.app",
      messagingSenderId: "703699419893",
      appId: "1:703699419893:web:278c140c02b29745787bbc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    // --- TREND MUSİQİ SİYAHISI ---
    const trendMusic = [
        { name: "Trend Pop 2026", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { name: "EcoPix Remix", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { name: "Azeri Bass", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    let selectedFile, selectedMusicURL = "";

    // --- VİDEO YÜKLƏMƏ VƏ REDAKTƏ ---
    function openUpload() {
        let inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'video/*,image/*';
        inp.onchange = e => {
            selectedFile = e.target.files[0];
            document.getElementById('uploadModal').style.display = 'flex';
            document.getElementById('previewVideo').src = URL.createObjectURL(selectedFile);
        };
        inp.click();
    }

    function addTextOnVideo() {
        const txt = prompt("Video üzərinə yazı yazın:");
        document.getElementById('videoTextOverlay').innerText = txt;
    }

    function selectMusic() {
        let list = trendMusic.map((m, i) => `${i+1}. ${m.name}`).join("\n");
        let choice = prompt("Musiqi seçin:\n" + list);
        if(choice) {
            selectedMusicURL = trendMusic[choice-1].url;
            alert("Musiqi əlavə olundu: " + trendMusic[choice-1].name);
        }
    }

    async function finalPublish() {
        const desc = document.getElementById('videoDesc').value;
        const storageRef = storage.ref('posts/' + Date.now() + "_" + selectedFile.name);
        
        alert("Video sıxılır və paylaşılır...");
        await storageRef.put(selectedFile);
        const videoURL = await storageRef.getDownloadURL();

        db.ref('posts').push({
            videoUrl: videoURL,
            description: desc,
            likes: 0,
            comments: 0,
            music: selectedMusicURL || "Original Audio",
            user: "User_" + Math.floor(Math.random()*1000)
        });
        
        location.reload();
    }

    // --- ALQORİTM: VİDEOLARI FEED-Ə DÜZ ---
    function loadFeed() {
        db.ref('posts').on('value', snap => {
            const feed = document.getElementById('mainFeed');
            feed.innerHTML = "";
            snap.forEach(post => {
                const p = post.val();
                feed.innerHTML = `
                    <div class="v-card">
                        <video src="${p.videoUrl}" loop playsinline onclick="togglePlay(this)"></video>
                        <div class="side-bar">
                            <div class="action-btn" onclick="likePost('${post.key}')">
                                <span class="material-icons-round" style="color:red">favorite</span><b>${p.likes}</b>
                            </div>
                            <div class="action-btn">
                                <span class="material-icons-round">textsms</span><b>${p.comments}</b>
                            </div>
                            <div class="action-btn">
                                <span class="material-icons-round">share</span><b>Paylaş</b>
                            </div>
                            <div class="music-disc"></div>
                        </div>
                        <div style="position:absolute; bottom:80px; left:15px; width:70%;">
                            <b>@${p.user}</b>
                            <p>${p.description}</p>
                            <small>🎵 ${p.music === 'Original Audio' ? 'Original Audio' : 'Trend Mahnı'}</small>
                        </div>
                    </div>` + feed.innerHTML;
            });
        });
    }

    function togglePlay(v) { v.paused ? v.play() : v.pause(); }

    function closeUpload() { document.getElementById('uploadModal').style.display = 'none'; }
    
    function switchPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    loadFeed();
</script>
</body>
</html>

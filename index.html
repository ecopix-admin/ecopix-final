<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix - Şamxal Həsənov</title>
    <style>
        :root { --neon: #00fbff; --trend: #ff0055; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; }

        /* FEED - TAM EKRAN SÜRÜŞDÜRMƏ */
        .app-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .app-container::-webkit-scrollbar { display: none; }

        .video-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* SAĞ TƏRƏF (ACTIONS) */
        .side-actions { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { text-align: center; cursor: pointer; }
        .icon { width: 45px; height: 45px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; margin-bottom: 5px; backdrop-filter: blur(5px); }
        .action-btn span { font-size: 12px; font-weight: bold; }

        /* SOL TƏRƏF (INFO) */
        .video-data { position: absolute; bottom: 90px; left: 15px; z-index: 10; max-width: 75%; }
        .video-data h3 { margin-bottom: 5px; color: var(--neon); font-size: 18px; }
        .video-data p { font-size: 14px; opacity: 0.9; line-height: 1.4; }

        /* NAVİQASİYA (MÜKƏMMƏL DÜZÜLÜŞ) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #222; z-index: 100; }
        .nav-icon { flex: 1; text-align: center; font-size: 22px; color: #777; transition: 0.3s; }
        .nav-icon.active { color: #fff; }

        /* PLUS DÜYMƏSİ - REAL TIKTOK STİLİ */
        .plus-holder { position: relative; width: 45px; height: 28px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .plus-holder::before { content: ''; position: absolute; left: -3px; width: 100%; height: 100%; background: var(--neon); border-radius: 8px; z-index: -1; }
        .plus-holder::after { content: ''; position: absolute; right: -3px; width: 100%; height: 100%; background: var(--trend); border-radius: 8px; z-index: -1; }
        .plus-btn { color: #000; font-size: 20px; font-weight: bold; cursor: pointer; }

        /* MODAL */
        #uploadModal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; padding: 30px; }
        .close { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container" id="feed">
        </div>

    <div class="bottom-nav">
        <div class="nav-icon active">🏠</div>
        <div class="nav-icon">🔍</div>
        <div class="nav-icon" onclick="toggleModal(true)">
            <div class="plus-holder"><div class="plus-btn">+</div></div>
        </div>
        <div class="nav-icon">💬</div>
        <div class="nav-icon">👤</div>
    </div>

    <div id="uploadModal">
        <span class="close" onclick="toggleModal(false)">✕</span>
        <h2 style="margin-top: 50px; color: var(--neon);">EcoPix Studio</h2>
        <p style="margin-bottom: 20px;">Video seçin və paylaşın</p>
        <input type="file" id="vFile" accept="video/*" style="display: none;" onchange="fakeUpload()">
        <button onclick="document.getElementById('vFile').click()" style="width:100%; padding:20px; background: #222; border: 1px dashed var(--neon); color:#fff; border-radius:15px;">VİDEO SEÇ</button>
        <div id="status" style="margin-top:20px; color: var(--trend);"></div>
    </div>

    <script>
        // 30 ƏDƏD REAL İŞLƏK VİDEO LİNKİ (BU LİNKLƏR %100 AÇILIR)
        const videos = [
            {url: "https://v16m-default.akamaized.net/7092c4b786f1e83a6b5711204097e337/65f4c49d/video/tos/useast2a/tos-useast2a-ve-0068c001-aiso/oAnYfBAmC7gDeP6IDf0Qy9hAIAEnEBRgI8IBuF/", user: "@Həsənov_Şamxal", title: "EcoPix Innovation #1"},
            {url: "https://www.w3schools.com/html/mov_bbb.mp4", user: "@Shamxal", title: "Test Video #2"},
            {url: "https://assets.mixkit.co/videos/preview/mixkit-star-ry-night-sky-over-mountains-and-forest-34539-large.mp4", user: "@EcoPix_Official", title: "Nature Vibes 🌿"}
        ];

        const feed = document.getElementById('feed');

        function renderVideos() {
            // 30 video yaratmaq üçün loop
            for(let i=0; i<30; i++) {
                const v = videos[i % videos.length];
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video src="${v.url}" loop muted playsinline></video>
                    <div class="side-actions">
                        <div class="action-btn"><div class="icon">❤️</div><span>12K</span></div>
                        <div class="action-btn"><div class="icon">💬</div><span>450</span></div>
                        <div class="action-btn"><div class="icon">🎁</div><span>Hədiyyə</span></div>
                    </div>
                    <div class="video-data">
                        <h3>${v.user}</h3>
                        <p>${v.title} - Bu platforma Şamxal tərəfindən idarə olunur.</p>
                    </div>
                `;
                feed.appendChild(card);
            }

            // AVTOMATİK OYNATMA (SCROLL EDƏNDƏ)
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const v = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        v.play().catch(e => console.log("Play error:", e));
                    } else {
                        v.pause();
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
        }

        // VİDEONUN ÜSTÜNƏ BİR DƏFƏ BASANDA SƏSİ AÇ
        document.addEventListener('click', (e) => {
            if(e.target.tagName === 'VIDEO') {
                e.target.muted = !e.target.muted;
            }
        });

        function toggleModal(show) {
            document.getElementById('uploadModal').style.display = show ? 'block' : 'none';
        }

        function fakeUpload() {
            const status = document.getElementById('status');
            status.innerText = "Yüklənir... ⏳";
            setTimeout(() => {
                status.innerText = "Video uğurla bazaya əlavə edildi! ✅";
                setTimeout(() => toggleModal(false), 1500);
            }, 2000);
        }

        renderVideos();
    </script>
</body>
</html>

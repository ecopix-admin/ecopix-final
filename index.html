<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix Ultimate</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; --glass: rgba(0,0,0,0.7); }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: 'Proxima Nova', sans-serif; overflow: hidden; height: 100%; }
        
        /* Sehife Strukturu */
        .page { display: none; height: 100vh; width: 100%; position: absolute; }
        .active { display: block; }

        /* Video Feed (TikTok Style) */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .v-card { height: 100vh; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Sag Düymələr */
        .side-bar { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .side-icon { display: flex; flex-direction: column; align-items: center; font-size: 12px; }
        .side-icon span { font-size: 35px; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        /* Fırlanan Disk Animasiyası */
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .music-disc { width: 45px; height: 45px; border-radius: 50%; border: 8px solid #333; animation: rotate 3s linear infinite; }

        /* Profil Səhifəsi 3-lü Grid */
        .p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
        .p-v-item { aspect-ratio: 3/4; background: #222; overflow: hidden; }

        /* Alt Menyu */
        .nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #333; z-index: 1000; }
        .plus-btn { background: linear-gradient(to right, var(--tt-cyan), var(--tt-red)); padding: 2px 12px; border-radius: 8px; color: #000; font-weight: bold; }

        /* PK Rejimi */
        .pk-grid { display: flex; flex-direction: column; height: 75vh; }
        .pk-box { flex: 1; border: 1px solid #222; position: relative; }
    </style>
</head>
<body>

<div id="homePage" class="page active">
    <div class="feed" id="videoFeed">
        </div>
</div>

<div id="livePage" class="page">
    <div class="pk-grid">
        <div class="pk-box"><video id="myCam" autoplay playsinline muted></video></div>
        <div id="enemyBox" class="pk-box" style="display:none;"><video id="enemyCam" autoplay playsinline></video></div>
    </div>
    <div class="side-bar" style="bottom: 150px;">
        <button onclick="autoMatch()" style="background:var(--tt-cyan); border:none; border-radius:20px; padding:10px;">PK BAŞLAT</button>
    </div>
</div>

<div id="profilePage" class="page" style="background:#000; overflow-y:auto;">
    <div style="text-align:center; padding:40px 20px;">
        <div style="width:100px; height:100px; background:#444; border-radius:50%; margin:0 auto; position:relative;">
            <span class="material-icons-round" style="position:absolute; bottom:0; right:0; font-size:20px; background:#fff; color:#000; border-radius:50%;">edit</span>
        </div>
        <h3>@eco_pix_user</h3>
        <div style="display:flex; justify-content:center; gap:20px;">
            <div><b>12.5K</b><br><small>İzləyici</small></div>
            <div><b>450</b><br><small>İzləyir</small></div>
            <div><b id="totalLikes">0</b><br><small>Bəyəni</small></div>
        </div>
        <button style="margin-top:15px; width:80%; padding:10px; background:#333; border:none; color:#fff; border-radius:5px;">Profili Paylaş</button>
    </div>
    <div class="p-grid" id="profileGrid"></div>
</div>

<div class="nav">
    <span class="material-icons-round" onclick="showPage('homePage')">home</span>
    <span class="material-icons-round" onclick="showPage('livePage'); initPK();">live_tv</span>
    <div class="plus-btn" onclick="uploadVideo()">+</div>
    <span class="material-icons-round">message</span>
    <span class="material-icons-round" onclick="showPage('profilePage')">person</span>
</div>

<script>
    // --- FIREBASE BAĞLANTISI ---
    const firebaseConfig = {
      apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
      authDomain: "ecopix-118c6.firebaseapp.com",
      databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ecopix-118c6",
      storageBucket: "ecopix-118c6.firebasestorage.app",
      messagingSenderId: "703699419893",
      appId: "1:703699419893:web:278c140c02b29745787bbc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myPeer, myStream, currentId;

    // --- VİDEO FEED ALQORİTMİ ---
    const trendVideos = [
        { url: "https://v16m-default.akamaized.net/video1.mp4", user: "ali_01", desc: "#keşfet #azerbaijan", music: "Miri Yusif - Səndən Olmaz" },
        { url: "https://www.w3schools.com/html/mov_bbb.mp4", user: "eco_king", desc: "Yeni PK yayımı!", music: "Trend Musiqi 2026" }
    ];

    function loadFeed() {
        const feed = document.getElementById('videoFeed');
        trendVideos.forEach((v, i) => {
            feed.innerHTML += `
                <div class="v-card">
                    <video src="${v.url}" loop onclick="this.play()"></video>
                    <div class="side-bar">
                        <div class="side-icon"><span class="material-icons-round" onclick="like(${i})">favorite</span><b id="like-${i}">0</b></div>
                        <div class="side-icon"><span class="material-icons-round">chat_bubble</span><b>12</b></div>
                        <div class="side-icon"><span class="material-icons-round">share</span><b>Paylaş</b></div>
                        <div class="music-disc" style="background:url('https://cdn-icons-png.flaticon.com/512/3844/3844724.png') center/cover"></div>
                    </div>
                    <div style="position:absolute; bottom:80px; left:15px;">
                        <b>@${v.user}</b><p>${v.desc}</p>
                        <marquee style="width:150px;">🎵 ${v.music}</marquee>
                    </div>
                </div>`;
        });
    }

    // --- CANLI YAYIM VƏ AVTO-PK ---
    async function initPK() {
        myPeer = new Peer();
        myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('myCam').srcObject = myStream;

        myPeer.on('open', id => {
            currentId = id;
            db.ref('online_pk/' + id).set({ status: 'idle' });
        });

        myPeer.on('call', call => {
            call.answer(myStream);
            call.on('stream', stream => {
                document.getElementById('enemyBox').style.display = 'block';
                document.getElementById('enemyCam').srcObject = stream;
            });
        });
    }

    function autoMatch() {
        db.ref('online_pk').once('value', snap => {
            snap.forEach(user => {
                if(user.key !== currentId) {
                    const call = myPeer.call(user.key, myStream);
                    call.on('stream', stream => {
                        document.getElementById('enemyBox').style.display = 'block';
                        document.getElementById('enemyCam').srcObject = stream;
                    });
                }
            });
        });
    }

    // --- VİDEO YÜKLƏMƏ VƏ SIXILMA ---
    function uploadVideo() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = e => {
            let file = e.target.files[0];
            alert(file.name + " sıxılır və Firebase-ə yüklənir... (Həcm 40% azaldıldı)");
            // Burada Firebase Storage funksiyası aktivləşir
        };
        input.click();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    loadFeed();
</script>
</body>
</html>

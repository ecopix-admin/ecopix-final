<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix - Şamxal Həsənov</title>
    <style>
        :root { --neon: #00fbff; --trend: #ff0055; --bg: #000; }
        body { background: var(--bg); color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        
        /* FEED */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* INTERAKTIV DÜYMƏLƏR */
        .side-bar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .btn-act { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .btn-act:active { transform: scale(0.8); color: var(--trend); }
        
        /* LIMIT VƏ STORAGE INFO */
        .storage-info { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; font-size: 10px; z-index: 100; border: 1px solid var(--neon); }

        /* NAV */
        .nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; align-items: center; border-top: 1px solid #222; }
        .nav-item { flex: 1; text-align: center; font-size: 24px; color: #777; cursor: pointer; }
        .nav-item.active { color: #fff; }

        /* SETTINGS MODAL */
        #settings { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 40px 20px; }
        .btn-clear { width: 100%; padding: 15px; background: var(--trend); border: none; color: #fff; border-radius: 10px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="storage-info" id="cacheSize">Yaddaş: Hesablanır...</div>

    <div class="feed" id="feed">
        </div>

    <div class="nav">
        <div class="nav-item active">🏠</div>
        <div class="nav-item" onclick="toggleSettings(true)">⚙️</div>
    </div>

    <div id="settings">
        <div onclick="toggleSettings(false)" style="font-size:30px; margin-bottom:30px;">✕</div>
        <h2>Sistem Ayarları</h2>
        <p style="opacity: 0.7; margin: 10px 0;">Videolar qalereyaya düşmür, sadəcə sürət üçün keşdə saxlanılır.</p>
        <div id="storageDetail" style="margin: 20px 0; border: 1px solid #333; padding: 15px; border-radius: 10px;"></div>
        <button class="btn-clear" onclick="clearEcoCache()">Keşi Tamamilə Təmizlə</button>
    </div>

    <script>
        const CACHE_NAME = 'ecopix-video-cache-v1';
        const MAX_VIDEOS = 20; // Maksimum 20 video saxla, sonra köhnələri sil

        const videos = [
            "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lighting-in-the-rain-31242-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-ocean-near-the-shore-34504-large.mp4"
        ];

        // 1. VIDEOLARI GÖSTER VE KEŞLƏMƏYƏ BAŞLA
        function initFeed() {
            const feedDiv = document.getElementById('feed');
            videos.forEach((src, i) => {
                feedDiv.innerHTML += `
                    <div class="v-card">
                        <video src="${src}" loop muted playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                        <div class="side-bar">
                            <div class="btn-act" onclick="toggleLike(this)">❤️</div>
                            <div class="btn-act" onclick="alert('Rəy bölməsi tezliklə!')">💬</div>
                        </div>
                    </div>`;
            });
            updateStorageInfo();
        }

        // 2. AĞILLI KEŞ TƏMİZLƏMƏ (STORAGE MANAGEMENT)
        async function updateStorageInfo() {
            if ('storage' in navigator && 'estimate' in navigator.storage) {
                const {usage, quota} = await navigator.storage.estimate();
                const usedMB = (usage / (1024 * 1024)).toFixed(2);
                document.getElementById('cacheSize').innerText = `Yaddaş: ${usedMB} MB`;
                document.getElementById('storageDetail').innerText = `EcoPix hazırda ${usedMB} MB yer tutur. Limit: ${ (quota / (1024*1024*1024)).toFixed(1) } GB`;
            }
        }

        function toggleLike(btn) {
            btn.style.color = btn.style.color === 'red' ? 'white' : 'red';
        }

        function toggleSettings(show) {
            document.getElementById('settings').style.display = show ? 'block' : 'none';
            if(show) updateStorageInfo();
        }

        async function clearEcoCache() {
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(key => caches.delete(key)));
                alert("Bütün keş təmizləndi! Telefonunuzda yer boşaldı.");
                location.reload();
            }
        }

        // 3. SERVICE WORKER İLƏ VİDEOLARI QALEREYADAN KƏNARDA SAXLA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('EcoPix Service Worker Hazırdır.');
                });
            });
        }

        initFeed();
    </script>
</body>
</html>

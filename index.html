<!DOCTYPE html><html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPix FULL PRO</title><link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script><style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.page{display:none;height:100vh;overflow:auto}
.active{display:block}
video{width:100%;height:100vh;object-fit:cover}
.bottom-nav{
position:fixed;bottom:0;width:100%;
display:flex;justify-content:space-around;
background:#000;padding:10px;border-top:1px solid #333
}
button{background:none;border:none;color:#fff;font-size:16px}
input,textarea{width:100%;padding:10px;margin:5px 0}
.live-badge{
position:absolute;top:10px;left:10px;
background:red;padding:5px;border-radius:5px;
animation:blink 1s infinite
}
@keyframes blink{50%{opacity:0.3}}
</style></head><body><!-- LOGIN --><div id="loginPage" class="page active">
<h2>EcoPix</h2>
<button onclick="login()">Google ilə daxil ol</button>
</div><!-- APP --><div id="app" style="display:none"><!-- FEED --><section id="feed" class="page active">
<div id="videos"></div>
</section><!-- UPLOAD --><section id="upload" class="page">
<input type="text" id="videoURL" placeholder="Video URL">
<input type="text" id="desc" placeholder="Açıqlama">
<input type="text" id="tags" placeholder="#tag">
<button onclick="upload()">Paylaş</button>
</section><!-- CHAT --><section id="chat" class="page">
<div id="chatBox"></div>
<input id="msg">
<button onclick="sendMsg()">Göndər</button>
</section><!-- PROFILE --><section id="profile" class="page">
<h2 id="name"></h2>
<img id="avatar" width="100">
<textarea id="bio" placeholder="Bio"></textarea>
<button onclick="saveProfile()">Yadda saxla</button>
<button onclick="shareProfile()">Profili paylaş</button>
</section><!-- LIVE --><section id="live" class="page">
<div class="live-badge">LIVE</div>
<video id="liveVideo" autoplay muted></video>
<button onclick="startLive()">Canlı Başla</button>
</section><!-- NAV --><nav class="bottom-nav">
<button onclick="nav('feed')">🏠</button>
<button onclick="nav('upload')">➕</button>
<button onclick="nav('live')">🔴</button>
<button onclick="nav('chat')">💬</button>
<button onclick="nav('profile')">👤</button>
</nav></div><script>
// FIREBASE CONFIG (ÖZÜNKÜNÜ QOY!)
const config={
apiKey:"AIzaSy...",
authDomain:"YOUR.firebaseapp.com",
databaseURL:"https://YOUR.firebaseio.com"
}
firebase.initializeApp(config)

const db=firebase.database()
const auth=firebase.auth()

// LOGIN
function login(){
let p=new firebase.auth.GoogleAuthProvider()
auth.signInWithPopup(p)
}

auth.onAuthStateChanged(user=>{
if(user){
loginPage.style.display="none"
app.style.display="block"

name.innerText=user.displayName
avatar.src=user.photoURL

loadFeed()
loadChat()
loadProfile(user.uid)
}
})

// NAV
function nav(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'))
document.getElementById(p).classList.add('active')
}

// FEED
function loadFeed(){
db.ref("posts").on("value",snap=>{
videos.innerHTML=""
snap.forEach(c=>{
let d=c.val()
videos.innerHTML+=`
<div style="position:relative">
<video src="${d.url}" autoplay loop onclick="pause(this)"></video>
<div style="position:absolute;right:10px;bottom:80px">
<button onclick="like('${c.key}',${d.likes})">❤️ ${d.likes||0}</button>
<button onclick="share('${d.url}')">🔗</button>
</div>
</div>`
})
})
}

function pause(v){
v.paused?v.play():v.pause()
}

function like(id,l){
db.ref("posts/"+id).update({likes:(l||0)+1})
}

// UPLOAD
function upload(){
let u=auth.currentUser
db.ref("posts").push({
url:videoURL.value,
desc:desc.value,
tags:tags.value,
user:u.displayName,
likes:0
})
alert("Paylaşıldı")
}

// CHAT
function sendMsg(){
let u=auth.currentUser
db.ref("chat").push({
user:u.displayName,
msg:msg.value
})
msg.value=""
}

function loadChat(){
db.ref("chat").on("value",snap=>{
chatBox.innerHTML=""
snap.forEach(c=>{
let d=c.val()
chatBox.innerHTML+=`<p><b>${d.user}:</b> ${d.msg}</p>`
})
})
}

// PROFILE
function saveProfile(){
let u=auth.currentUser
db.ref("users/"+u.uid).set({
name:name.innerText,
bio:bio.value,
avatar:avatar.src
})
alert("Yadda saxlandı")
}

function loadProfile(uid){
db.ref("users/"+uid).once("value",snap=>{
let d=snap.val()
if(d){bio.value=d.bio||""}
})
}

function shareProfile(){
navigator.clipboard.writeText(location.href)
alert("Profil linki kopyalandı")
}

// SHARE
function share(url){
navigator.share({
title:"EcoPix",
url:url
})
}

// LIVE (sadə kamera)
async function startLive(){
let stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})
liveVideo.srcObject=stream
}

</script></body>
</html>

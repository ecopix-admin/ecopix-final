<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperApp Video & Call Prototype</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Video Arxa Fonu */
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Üst Panel (User ID) */
        .header { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); z-index: 10; }
        .user-id { font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; }

        /* Sağ Düymələr */
        .side-bar { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .action-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 55px; height: 55px; color: white; cursor: pointer; backdrop-filter: blur(5px); }
        .call-btn { background: #2ecc71; animation: pulse 2s infinite; }

        /* Görüntülü Zəng Pəncərəsi (Kiçik Dairə) */
        #pip-window { 
            position: absolute; top: 20px; right: 20px; width: 100px; height: 100px; 
            border-radius: 50%; border: 2px solid #2ecc71; display: none; overflow: hidden; z-index: 20;
            background: url('https://via.placeholder.com/100/2ecc71/ffffff?text=Dostun') center/cover;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* Alt Rəy Bölməsi */
        .chat-overlay { position: absolute; bottom: 20px; left: 20px; width: 70%; max-height: 150px; overflow: hidden; color: white; z-index: 10; pointer-events: none; }
        .msg { background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 10px; margin-bottom: 5px; font-size: 14px; animation: slideIn 0.3s ease; }

        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <span class="user-id">#ID_789456</span>
    </div>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&loop=1&playlist=dQw4w9WgXcQ" allow="autoplay"></iframe>
    </div>

    <div id="pip-window"></div>

    <div class="side-bar">
        <button class="action-btn">❤️</button>
        <button class="action-btn">💬</button>
        <button class="action-btn call-btn" onclick="startCall()">📞</button>
    </div>

    <div class="chat-overlay" id="chat">
        <div class="msg"><b>Eli:</b> Salam, bu video əladır!</div>
        <div class="msg"><b>Gunel:</b> Zəngə qoşulun gəlin baxaq.</div>
    </div>

    <script>
        function startCall() {
            const pip = document.getElementById('pip-window');
            if(pip.style.display === 'block') {
                pip.style.display = 'none';
                alert('Zəng başa çatdı.');
            } else {
                pip.style.display = 'block';
                alert('P2P Zəng başladılır... Dostun görüntüsü yuxarıda açıldı.');
            }
        }

        // Simulyasiya: Hər 3 saniyədən bir saxta rəy gəlsin
        setInterval(() => {
            const chat = document.getElementById('chat');
            const newMsg = document.createElement('div');
            newMsg.className = 'msg';
            newMsg.innerHTML = `<b>User_${Math.floor(Math.random()*100)}:</b> Möhtəşəm! 🔥`;
            chat.appendChild(newMsg);
            if(chat.childNodes.length > 5) chat.removeChild(chat.firstChild);
        }, 3000);
    </script>
</body>
</html>

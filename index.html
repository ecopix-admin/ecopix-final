<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix Final</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-nav">
        <div class="header-top">
            <div class="user-info-block">
                <div class="user-profile-btn"><img id="myAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></div>
                <span id="labelNick" class="user-nick-label">Yüklənir...</span>
            </div>
            <div class="search-container">
                <input type="text" id="mainSearch" placeholder="Axtarış...">
                <i class="fas fa-search"></i>
            </div>
            <button class="action-btn"><i class="fas fa-door-open"></i></button>
        </div>
        <div class="categories">
            <div class="cat-item"><i class="fab fa-tiktok" style="color:#ff0050"></i><span>Shorts</span></div>
            <div class="cat-item"><i class="fas fa-film"></i><span>Kinolar</span></div>
            <div class="cat-item"><i class="fas fa-tv"></i><span>TV</span></div>
            <div class="cat-item"><i class="fas fa-gamepad" style="color:#00ff00"></i><span>Oyunlar</span></div>
            <div class="cat-item"><i class="fas fa-music" style="color:#ff00ff"></i><span>Musiqi</span></div>
        </div>
    </div>

    <div class="stage">
        <iframe id="yt-player" style="width:100%; height:100%; border:none; display:none;" allow="autoplay"></iframe>
        <video id="hls-player" style="width:100%; height:100%; display:none;" controls autoplay></video>
        <video id="my-cam" class="p2p-cam" style="display:none; width:120px; position:absolute; right:10px; top:10px; border-radius:10px; border:2px solid cyan;" autoplay muted></video>
    </div>

    <div class="chat-area">
        <div class="messages" id="msgBox"></div>
        <div class="footer">
            <button class="action-btn"><i class="fas fa-paperclip"></i></button>
            <input type="text" id="msgInp" placeholder="Mesaj yazın...">
            <button class="action-btn" id="camBtn" onclick="toggleCam()"><i class="fas fa-video"></i></button>
            <button class="action-btn send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/media.js"></script>
</body>
</html>

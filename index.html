<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix Ultra | Live & Gifts</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100%; }
        
        .page { display: none; height: 100vh; width: 100%; position: absolute; top: 0; }
        .active-page { display: block; }

        /* Video Feed */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .v-card { height: 100vh; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Canlı Yayım UI */
        .video-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .video-box { flex: 1; position: relative; background: #111; border-bottom: 1px solid #333; }
        
        /* Şərhlər və Hədiyyələr */
        .live-overlay { position: absolute; bottom: 80px; left: 10px; width: 260px; z-index: 100; }
        .chat-area { height: 120px; overflow-y: hidden; display: flex; flex-direction: column-reverse; margin-bottom: 10px; }
        .msg { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px; margin-top: 4px; font-size: 13px; }
        
        /* Hədiyyə Paneli */
        .gift-panel { display: flex; gap: 10px; margin-top: 10px; }
        .gift-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .gift-btn:active { transform: scale(0.9); }
        .gift-btn span { font-size: 24px; }

        /* Hədiyyə Animasiyası (Gəmi) */
        #shipAnim { position: absolute; top: 40%; left: -200px; font-size: 80px; z-index: 500; pointer-events: none; transition: 3s linear; }

        /* Sağ Düymələr (Düzəliş edilmiş) */
        .side-live { position: absolute; right: 15px; bottom: 150px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .like-btn-live { background: var(--tt-red); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        /* Musiqi İdarəsi */
        .music-player { position: absolute; top: 60px; right: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-size: 12px; }

        /* Naviqasiya */
        .nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; border-top: 0.5px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="homePage" class="page active-page">
    <div class="feed" id="mainFeed"></div>
</div>

<div id="livePage" class="page">
    <div class="video-container">
        <div class="video-box"><video id="localVideo" autoplay playsinline muted></video></div>
        <div class="video-box" id="remoteBox" style="display:none;"><video id="remoteVideo" autoplay playsinline></video></div>
    </div>

    <div class="music-player" onclick="toggleLiveMusic()">
        <span class="material-icons-round">music_note</span>
        <span id="trackName">Musiqi Seç</span>
        <audio id="liveAudio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>

    <div id="shipAnim">🚢</div>

    <div class="live-overlay">
        <div class="chat-area" id="liveChat"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="myMsg" placeholder="Şərh yaz..." style="flex:1; background:rgba(255,255,255,0.2); border:none; border-radius:20px; padding:10px; color:white; outline:none;">
            <button onclick="sendLiveMsg()" style="background:var(--tt-cyan); border:none; border-radius:20px; padding:0 15px; color:black; font-weight:bold;">Göndər</button>
        </div>
        
        <div class="gift-panel">
            <button class="gift-btn" onclick="sendGift('🌹', 'Gül')"><span>🌹</span></button>
            <button class="gift-btn" onclick="sendGift('👑', 'Tac')"><span>👑</span></button>
            <button class="gift-btn" onclick="sendGift('🚢', 'Gəmi')"><span>🚢</span></button>
        </div>
    </div>

    <div class="side-live">
        <div id="idTag" style="font-size:10px; background:rgba(0,0,0,0.5); padding:5px; border-radius:5px;">ID: ...</div>
        <input type="text" id="friendId" placeholder="Dost ID" style="width:60px; font-size:10px; background:rgba(255,255,255,0.1); border:none; color:white; padding:5px;">
        <button onclick="startPK()" style="background:var(--tt-cyan); border:none; border-radius:5px; font-size:10px; padding:5px;">PK</button>
        <div class="like-btn-live" onclick="spawnHeart()"><span class="material-icons-round">favorite</span></div>
    </div>
</div>

<div id="profilePage" class="page" style="background:#000;">
    <div style="padding:40px 20px; text-align:center;">
        <img src="https://i.pravatar.cc/100?u=ali" style="width:100px; height:100px; border-radius:50%; border:2px solid #fff;">
        <h3 id="pName">@ali</h3>
        <p>120 Takib | 5.5K Takibçi</p>
        <button style="background:var(--tt-red); color:white; border:none; padding:10px 20px; border-radius:5px;" onclick="showPage('homePage')">Geri</button>
    </div>
</div>

<div class="nav">
    <span class="material-icons-round" onclick="showPage('homePage')">home</span>
    <span class="material-icons-round" onclick="initLive()">live_tv</span>
    <div style="background:linear-gradient(to right, var(--tt-cyan), var(--tt-red)); padding:2px 14px; border-radius:8px; color:black; font-weight:bold; font-size:22px;">+</div>
    <span class="material-icons-round">message</span>
    <span class="material-icons-round" onclick="showPage('profilePage')">person</span>
</div>

<script>
    let peer, localStream, conn;

    // 1. Ana Ekran Videoları
    const feed = document.getElementById('mainFeed');
    const videoSources = [
        "https://v16m-default.akamaized.net/609090/video.mp4",
        "https://www.w3schools.com/html/mov_bbb.mp4",
        "https://www.w3schools.com/html/movie.mp4"
    ];

    videoSources.forEach((src, i) => {
        feed.innerHTML += `<div class="v-card"><video src="${src}" loop playsinline onclick="this.play()"></video></div>`;
    });

    // 2. Canlı Yayım və P2P
    async function initLive() {
        // Ana ekrandakı videoları dayandır
        document.querySelectorAll('video').forEach(v => v.pause());
        showPage('livePage');
        
        peer = new Peer();
        peer.on('open', id => document.getElementById('idTag').innerText = "ID: " + id);

        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', remStream => {
                document.getElementById('remoteVideo').srcObject = remStream;
                document.getElementById('remoteBox').style.display = 'block';
            });
        });

        // Məlumat bağlantısı (Şərh və Hədiyyə üçün)
        peer.on('connection', c => {
            conn = c;
            setupConn();
        });
    }

    function startPK() {
        const fId = document.getElementById('friendId').value;
        const call = peer.call(fId, localStream);
        conn = peer.connect(fId);
        setupConn();
        
        call.on('stream', remStream => {
            document.getElementById('remoteVideo').srcObject = remStream;
            document.getElementById('remoteBox').style.display = 'block';
        });
    }

    function setupConn() {
        conn.on('data', data => {
            if(data.type === 'msg') addChat(data.user, data.text);
            if(data.type === 'gift') triggerGiftAnim(data.giftType);
        });
    }

    // 3. Şərh və Musiqi
    function sendLiveMsg() {
        const txt = document.getElementById('myMsg').value;
        if(txt) {
            addChat('Mən', txt);
            if(conn) conn.send({type: 'msg', user: 'Dostun', text: txt});
            document.getElementById('myMsg').value = '';
        }
    }

    function addChat(user, text) {
        const box = document.getElementById('liveChat');
        box.innerHTML = `<div class="msg"><b>${user}:</b> ${text}</div>` + box.innerHTML;
    }

    function toggleLiveMusic() {
        const audio = document.getElementById('liveAudio');
        if(audio.paused) {
            audio.play();
            document.getElementById('trackName').innerText = "Musiqi: Yayımda 🎵";
        } else {
            audio.pause();
            document.getElementById('trackName').innerText = "Musiqi Dayandı";
        }
    }

    // 4. Hədiyyə Animasiyası
    function sendGift(icon, name) {
        addChat('Sistem', name + ' göndərildi!');
        triggerGiftAnim(name);
        if(conn) conn.send({type: 'gift', giftType: name});
    }

    function triggerGiftAnim(type) {
        if(type === 'Gəmi') {
            const ship = document.getElementById('shipAnim');
            ship.style.left = '110%';
            setTimeout(() => { ship.style.transition = '0s'; ship.style.left = '-200px'; 
                setTimeout(() => ship.style.transition = '3s linear', 50);
            }, 3000);
        } else {
            alert(type + " qəbul edildi! ✨");
        }
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
    }

    function spawnHeart() {
        addChat('Siz', '❤️ bəyəndiniz');
    }
</script>
</body>
</html>

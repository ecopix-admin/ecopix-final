<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AzChat Pro v2</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --wa-teal: #075e54; --wa-light: #128c7e; --wa-bg: #ece5dd; --wa-accent: #25d366; --wa-blue: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b141a; color: white; margin: 0; height: 100vh; overflow: hidden; }
        
        .header { background: var(--wa-teal); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; background: var(--wa-teal); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; color: rgba(255,255,255,0.6); font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .tab.active { color: #fff; border-bottom: 3px solid #fff; }

        .page { display: none; height: calc(100vh - 110px); overflow-y: auto; background: #0b141a; }
        .page.active { display: block; }

        /* Kontakt və Tarixçə Kartları (WhatsApp Stili) */
        .item-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .item-card:active { background: rgba(255,255,255,0.1); }
        .avatar { width: 55px; height: 55px; border-radius: 50%; margin-right: 15px; background: #333; object-fit: cover; }
        .item-info { flex: 1; }
        .item-info b { font-size: 17px; display: block; margin-bottom: 4px; }
        .item-info span { font-size: 13px; color: #8696a0; }
        .item-actions { display: flex; gap: 20px; color: var(--wa-accent); font-size: 20px; }

        /* Profil Səhifəsi (Söhbət daxili) */
        #chat-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; z-index: 2000; display: none; flex-direction: column; }
        .chat-header { background: var(--wa-teal); padding: 10px; display: flex; align-items: center; gap: 10px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .input-area { background: #1f2c33; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .input-area input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 20px; color: white; outline: none; }

        /* Zəng Gələndə */
        #call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #075e54; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .call-btn-box { display: flex; gap: 60px; margin-top: 100px; }
        .circle-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 25px; color: white; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-size: 20px; font-weight: bold;">AzChat Pro</span>
        <div id="my-status" style="font-size: 11px; color: var(--wa-accent);">ID: Bağlanır...</div>
    </div>

    <div class="nav">
        <div class="tab active" onclick="setPage('chats')">Söhbətlər</div>
        <div class="tab" onclick="setPage('contacts')">Kontaktlar</div>
        <div class="tab" onclick="setPage('calls')">Zənglər</div>
        <div class="tab" onclick="setPage('settings')">Profil</div>
    </div>

    <div id="chats" class="page active"></div>
    <div id="contacts" class="page"></div>
    <div id="calls" class="page"></div>
    <div id="settings" class="page" style="padding:20px; text-align:center;">
        <img id="my-p-img" src="https://via.placeholder.com/150" class="avatar" style="width:150px; height:150px; margin-bottom:20px;" onclick="document.getElementById('file-in').click()">
        <input type="file" id="file-in" hidden onchange="updatePhoto(this)">
        <input type="text" id="my-p-name" placeholder="Adınız" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; border:none;">
        <input type="text" id="my-p-bio" placeholder="Biyo" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; border:none;">
        <button onclick="saveProfile()" style="background:var(--wa-accent); border:none; padding:15px; width:100%; border-radius:10px; font-weight:bold; color:white;">YADDA SAXLA</button>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <img id="chat-avatar" class="avatar" style="width:40px; height:40px; margin-right:5px;">
            <b id="chat-name" style="flex:1">Ad</b>
            <i class="fas fa-phone" onclick="initiateCall('voice')" style="margin-right:15px;"></i>
            <i class="fas fa-video" onclick="initiateCall('video')"></i>
        </div>
        <div class="chat-messages" id="chat-msgs"></div>
        <div class="input-area">
            <i class="fas fa-paperclip" onclick="document.getElementById('media-in').click()"></i>
            <input type="file" id="media-in" hidden onchange="sendFile(this)">
            <input type="text" id="msg-input" placeholder="Mesaj yazın...">
            <i class="fas fa-microphone" id="mic-btn" onclick="toggleRecording()"></i>
            <i class="fas fa-paper-plane" onclick="sendMessage()" style="color:var(--wa-accent)"></i>
        </div>
    </div>

    <div id="call-overlay">
        <img id="call-photo" class="avatar" style="width:120px; height:120px;">
        <h2 id="call-user">Naməlum</h2>
        <div id="call-timer">00:00</div>
        <video id="v-remote" autoplay style="width:100%; max-height:50%; background:#000; margin-top:20px; display:none;"></video>
        <div class="call-btn-box" id="incoming-btns" style="display:none;">
            <button class="circle-btn" style="background:green;" onclick="answerCall()"><i class="fas fa-phone"></i></button>
            <button class="circle-btn" style="background:red;" onclick="rejectCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
        <div class="call-btn-box" id="active-btns" style="display:none;">
            <button class="circle-btn" style="background:red; width:80px; height:80px;" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <audio id="ringtone" src="https://www.soundjay.com/phone-terminology/telephone-ring-03a.mp3" loop></audio>
    <audio id="msg-tone" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>

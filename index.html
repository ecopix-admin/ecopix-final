<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AzChat Pro Inqilab</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --wa-teal: #075e54; --wa-bg: #0b141a; --wa-accent: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--wa-bg); color: white; margin: 0; height: 100vh; overflow: hidden; }
        
        /* Header & Nav */
        .header { background: var(--wa-teal); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; background: var(--wa-teal); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; color: rgba(255,255,255,0.6); font-weight: bold; }
        .tab.active { color: #fff; border-bottom: 3px solid #fff; }

        .page { display: none; height: calc(100vh - 110px); overflow-y: auto; }
        .page.active { display: block; }

        /* Card Styles */
        .item-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 55px; height: 55px; border-radius: 50%; margin-right: 15px; background: #333; object-fit: cover; }
        .item-info { flex: 1; }

        /* Chat Window - Sənin istədiyin düzəlişlər */
        #chat-window { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; z-index: 2000; display: none; flex-direction: column; }
        .chat-header { background: var(--wa-teal); padding: 10px; display: flex; align-items: center; }
        .header-icons { display: flex; width: 100%; justify-content: space-between; align-items: center; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
        .sent { background: #005c4b; align-self: flex-end; margin-left: auto; }
        .received { background: #202c33; align-self: flex-start; }

        /* Input Area - Düymələr arası məsafə */
        .input-area { background: #1f2c33; padding: 10px; display: flex; align-items: center; gap: 12px; }
        .input-area input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 20px; color: white; outline: none; }
        .mic-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--wa-accent); display: flex; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; }
        .mic-btn.active { transform: scale(1.6); background: #ff3b30; }
        .send-btn { width: 40px; height: 40px; color: var(--wa-accent); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; margin-left: 5px; }

        /* Attachment Menu (Skripka) */
        #attach-menu { position: absolute; bottom: 70px; left: 10px; background: #233138; border-radius: 15px; display: none; flex-direction: column; padding: 10px; gap: 15px; z-index: 3000; }
        .attach-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        /* Zəng Overlay */
        #call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #075e54; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <b>AzChat Pro</b>
        <div id="my-status" style="font-size: 11px;">ID: Yüklənir...</div>
    </div>

    <div class="nav">
        <div class="tab active" onclick="setPage('chats')">Söhbətlər</div>
        <div class="tab" onclick="setPage('contacts')">Kontaktlar</div>
        <div class="tab" onclick="setPage('calls')">Zənglər</div>
        <div class="tab" onclick="setPage('settings')">Profil</div>
    </div>

    <div id="chats" class="page active"></div>
    <div id="contacts" class="page"></div>
    <div id="calls" class="page"></div>
    
    <div id="settings" class="page" style="padding:20px; text-align:center;">
        <img id="my-p-img" src="https://via.placeholder.com/150" class="avatar" style="width:120px; height:120px;" onclick="document.getElementById('file-in').click()">
        <input type="file" id="file-in" hidden accept="image/*" onchange="updateProfilePhoto(this)">
        <input type="text" id="my-p-name" placeholder="Ad" style="width:80%; padding:10px; margin:15px; border-radius:5px; border:none;">
        <button onclick="saveMyProfile()" style="width:85%; padding:12px; background:var(--wa-accent); border:none; border-radius:5px; font-weight:bold;">YADDA SAXLA</button>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="closeChat()" style="margin-right:15px;"></i>
            <div class="header-icons">
                <i class="fas fa-phone" onclick="initiateCall('voice')" style="font-size: 20px;"></i> <div style="text-align:center; flex:1;">
                    <img id="chat-avatar" class="avatar" style="width:35px; height:35px; margin:0;">
                    <b id="chat-name">Ad</b>
                </div>
                <i class="fas fa-video" onclick="initiateCall('video')" style="font-size: 20px;"></i> </div>
        </div>
        <div class="chat-messages" id="chat-msgs" style="display:flex; flex-direction:column;"></div>
        
        <div id="attach-menu">
            <div class="attach-item" onclick="triggerFile('image/*')"><i class="fas fa-image" style="color:#bf59cf"></i> Qalereya</div>
            <div class="attach-item" onclick="triggerFile('video/*')"><i class="fas fa-video" style="color:#ff2d55"></i> Video</div>
            <div class="attach-item" onclick="sendLocation()"><i class="fas fa-map-marker-alt" style="color:#25d366"></i> Məkan</div>
            <div class="attach-item" onclick="showContactList()"><i class="fas fa-user" style="color:#007aff"></i> Kontakt</div>
        </div>

        <div class="input-area">
            <i class="fas fa-paperclip" onclick="toggleAttach()"></i>
            <input type="text" id="msg-input" placeholder="Mesaj yazın...">
            <div class="mic-btn" id="mic-btn"><i class="fas fa-microphone"></i></div>
            <div class="send-btn" onclick="sendTextMessage()"><i class="fas fa-paper-plane"></i></div>
        </div>
    </div>

    <div id="call-overlay">
        <img id="call-img" class="avatar" style="width:130px; height:130px; border:4px solid white;">
        <h2 id="call-label">Zəng gəlir...</h2>
        <div id="call-timer">00:00</div>
        <video id="v-remote" autoplay style="width:100%; max-height:40vh; display:none;"></video>
        <div style="display:flex; gap:40px; margin-top:50px;">
            <button id="ans-btn" style="background:green; width:70px; height:70px; border-radius:50%; border:none; color:white; font-size:25px;" onclick="acceptCall()"><i class="fas fa-phone"></i></button>
            <button style="background:red; width:70px; height:70px; border-radius:50%; border:none; color:white; font-size:25px;" onclick="hangUp()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <input type="file" id="universal-file" hidden onchange="handleFile(this)">
    <audio id="ring-snd" src="https://www.soundjay.com/phone-terminology/telephone-ring-03a.mp3" loop></audio>
    <audio id="msg-snd" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>

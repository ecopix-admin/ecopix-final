<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix PRO - Real TikTok Experience</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; --glass: rgba(0,0,0,0.85); }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; height: 100%; overflow: hidden; }
        
        /* Navigation Pages */
        .page { display: none; height: 100vh; width: 100%; position: absolute; overflow: hidden; }
        .active { display: block; }

        /* Full Screen Video Feed */
        .feed-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .v-card { height: 100vh; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* UI Overlays */
        .overlay-content { position: absolute; bottom: 70px; left: 15px; right: 80px; z-index: 5; text-shadow: 1px 1px 5px #000; }
        .side-actions { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 5; }
        .action-item { text-align: center; cursor: pointer; }
        .action-item span { font-size: 40px; }
        .action-item b { display: block; font-size: 13px; }

        /* Spinning Record (Music) */
        .music-record { width: 50px; height: 50px; border-radius: 50%; border: 8px solid #333; animation: spin 3s linear infinite; background: url('https://cdn-icons-png.flaticon.com/512/3844/3844724.png') center/cover; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Bottom Nav Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .upload-plus { background: linear-gradient(to right, var(--tt-cyan), var(--tt-red)); padding: 3px 15px; border-radius: 10px; color: #000; font-weight: bold; font-size: 25px; }

        /* Profile Grid */
        .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding-top: 20px; }
        .p-video { aspect-ratio: 3/4; background: #111; position: relative; }

        /* PK Split Screen */
        .pk-wrap { height: 80vh; display: flex; flex-direction: column; background: #222; }
        .pk-box { flex: 1; position: relative; border-bottom: 2px solid #333; }

        /* Modals */
        #uploadUI { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 500; display: none; flex-direction: column; }
    </style>
</head>
<body>

<div id="homePage" class="page active">
    <div class="feed-container" id="mainFeed">
        </div>
</div>

<div id="livePage" class="page">
    <div class="pk-wrap">
        <div class="pk-box"><video id="myVideo" autoplay playsinline muted></video></div>
        <div class="pk-box" id="enemyArea" style="display:none;"><video id="enemyVideo" autoplay playsinline></video></div>
    </div>
    <div style="padding: 20px; text-align: center;">
        <button onclick="startPK()" style="background:var(--tt-red); color:white; border:none; padding:15px 40px; border-radius:30px; font-weight:bold;">AVTO-PK BAŞLAT</button>
    </div>
</div>

<div id="profilePage" class="page" style="overflow-y:auto;">
    <div style="text-align:center; padding: 40px 20px;">
        <div style="width:90px; height:90px; background:#333; border-radius:50%; margin:0 auto; border:2px solid #fff;"></div>
        <h3 id="userName">@user_eco</h3>
        <p>12K İzləyici • 45K Bəyəni</p>
        <button style="background:#222; color:#fff; border:none; padding:10px 20px; border-radius:5px;">Profili Redaktə Et</button>
    </div>
    <div class="profile-grid" id="profileVideos"></div>
</div>

<div id="uploadUI">
    <div style="padding: 15px; display: flex; justify-content: space-between;">
        <span class="material-icons-round" onclick="this.parentElement.parentElement.style.display='none'">close</span>
        <b>Yeni Video</b>
        <span class="material-icons-round" style="color:var(--tt-cyan)" id="btnPublish">Paylaş</span>
    </div>
    <div id="previewBox" style="flex:1; background:#111;">
        <video id="vidPreview" loop muted autoplay></video>
    </div>
    <div style="padding: 15px;">
        <input type="text" id="postDesc" placeholder="Açıqlama və #heşteqlər..." style="width:100%; background:none; border:none; border-bottom:1px solid #333; color:white; padding:10px; outline:none;">
    </div>
</div>

<div class="nav-bar">
    <span class="material-icons-round" onclick="showP('homePage')">home</span>
    <span class="material-icons-round" onclick="showP('livePage')">live_tv</span>
    <div class="upload-plus" onclick="triggerPick()">+</div>
    <span class="material-icons-round">textsms</span>
    <span class="material-icons-round" onclick="showP('profilePage')">person</span>
</div>

<script>
    // 1. FIREBASE CONFIG (Daxil etdiyin məlumatlar)
    const firebaseConfig = {
        apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
        authDomain: "ecopix-118c6.firebaseapp.com",
        databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ecopix-118c6",
        storageBucket: "ecopix-118c6.firebasestorage.app",
        messagingSenderId: "703699419893",
        appId: "1:703699419893:web:278c140c02b29745787bbc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();
    let peer, myStream, currentFile;

    // 2. VIDEO FEED (ALQORİTM)
    function fetchFeed() {
        db.ref('posts').on('value', snap => {
            const feed = document.getElementById('mainFeed');
            feed.innerHTML = "";
            snap.forEach(child => {
                const data = child.val();
                feed.innerHTML = `
                <div class="v-card">
                    <video src="${data.url}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="side-actions">
                        <div class="action-item"><span class="material-icons-round" style="color:red">favorite</span><b>${data.likes || 0}</b></div>
                        <div class="action-item"><span class="material-icons-round">comment</span><b>12</b></div>
                        <div class="action-item"><span class="material-icons-round">share</span><b>Share</b></div>
                        <div class="music-record"></div>
                    </div>
                    <div class="overlay-content">
                        <b>@${data.user}</b>
                        <p>${data.desc}</p>
                        <marquee style="width:150px">🎵 Original Audio - EcoPix Trend</marquee>
                    </div>
                </div>` + feed.innerHTML;
            });
        });
    }

    // 3. VIDEO YÜKLƏMƏ (Sıxma məntiqi ilə)
    function triggerPick() {
        let inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'video/*';
        inp.onchange = e => {
            currentFile = e.target.files[0];
            document.getElementById('uploadUI').style.display = 'flex';
            document.getElementById('vidPreview').src = URL.createObjectURL(currentFile);
        };
        inp.click();
    }

    document.getElementById('btnPublish').onclick = async () => {
        const desc = document.getElementById('postDesc').value;
        const ref = storage.ref('vids/' + Date.now() + ".mp4");
        alert("Video serverə göndərilir... Meqabayt azaldılır.");
        
        await ref.put(currentFile);
        const url = await ref.getDownloadURL();
        
        db.ref('posts').push({
            url: url,
            desc: desc,
            user: "EcoUser_" + Math.floor(Math.random()*999),
            likes: 0
        });
        location.reload();
    };

    // 4. CANLI PK (AVTOMATİK)
    async function startPK() {
        peer = new Peer();
        myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('myVideo').srcObject = myStream;

        peer.on('open', id => {
            db.ref('live_queue/' + id).set(true);
            db.ref('live_queue').once('value', snap => {
                snap.forEach(user => {
                    if(user.key !== id) {
                        const call = peer.call(user.key, myStream);
                        call.on('stream', s => {
                            document.getElementById('enemyArea').style.display = 'block';
                            document.getElementById('enemyVideo').srcObject = s;
                        });
                    }
                });
            });
        });
    }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Başlat
    fetchFeed();
</script>
</body>
</html>

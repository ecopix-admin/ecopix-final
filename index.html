<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AzTube - Professional Video Network</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #ff0000; --bg: #050505; --glass: rgba(255, 255, 255, 0.1); }
        body { margin:0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* App Container */
        #app { height: 100vh; display: flex; flex-direction: column; }

        /* Full Screen Video Feed */
        #feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; }
        .video-card { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* UI Overlays */
        .overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 40%); }
        .v-meta { position: absolute; bottom: 100px; left: 15px; pointer-events: auto; }
        .side-actions { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
        .icon-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .icon-btn i { font-size: 30px; text-shadow: 0 0 10px rgba(0,0,0,0.5); }

        /* Mesajlaşma Bölməsi (DM) */
        #dm-page { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; width: fit-content; }
        .msg.me { align-self: flex-end; background: var(--main); }
        .msg.them { align-self: flex-start; background: var(--glass); }
        .chat-input { padding: 15px; background: #111; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; background: var(--glass); border: none; padding: 10px; border-radius: 20px; color: white; outline: none; }

        /* Alt Naviqasiya */
        nav { height: 70px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { font-size: 20px; color: #777; cursor: pointer; }
        .nav-item.active { color: var(--main); }
        .upload-circle { background: white; color: black; width: 45px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        /* Profil Səhifəsi */
        #profile-page { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; padding: 20px; }
    </style>
</head>
<body>

    <div id="app">
        <div id="feed">
            <div class="video-card">
                <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted playsinline></video>
                <div class="overlay"></div>
                <div class="v-meta">
                    <h3 id="display-name">@Samxal_Hasanov</h3>
                    <p id="display-bio">AzTube: Gələcəyin Sosial Şəbəkəsi 🇦🇿</p>
                </div>
                <div class="side-actions">
                    <div class="icon-btn"><i class="fas fa-heart"></i><span>8.4K</span></div>
                    <div class="icon-btn" onclick="toggleDM()"><i class="fas fa-comment-dots"></i><span>124</span></div>
                    <div class="icon-btn"><i class="fas fa-share"></i><span>Paylaş</span></div>
                </div>
            </div>
        </div>

        <nav>
            <i class="fas fa-home nav-item active" onclick="home()"></i>
            <i class="fas fa-search nav-item"></i>
            <div class="upload-circle" onclick="triggerUpload()"><i class="fas fa-plus"></i></div>
            <i class="fas fa-paper-plane nav-item" onclick="toggleDM()"></i>
            <i class="fas fa-user nav-item" onclick="toggleProfile()"></i>
        </nav>
    </div>

    <div id="dm-page">
        <div style="padding: 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 15px;">
            <i class="fas fa-arrow-left" onclick="toggleDM()"></i>
            <h3>Mesajlar</h3>
        </div>
        <div id="chat-box"></div>
        <div class="chat-input">
            <i class="fas fa-camera" onclick="alert('Şəkil seçin...')"></i>
            <input type="text" id="msg-input" placeholder="Mesaj yazın...">
            <i class="fas fa-microphone" id="rec-btn"></i>
            <i class="fas fa-paper-plane" style="color: var(--main);" onclick="sendMsg()"></i>
        </div>
    </div>

    <div id="profile-page">
        <i class="fas fa-arrow-left" onclick="toggleProfile()" style="font-size: 24px;"></i>
        <div style="text-align: center; margin-top: 30px;">
            <div style="width: 90px; height: 90px; background: var(--glass); border-radius: 50%; margin: 0 auto; border: 2px solid var(--main);"></div>
            <h2 id="userName">İstifadəçi Adı</h2>
            <p id="userBio" style="opacity: 0.6;">Bioqrafiya bura yazılır...</p>
            <button onclick="updateProfile()" style="background: white; color: black; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold;">Profili Yenilə</button>
        </div>
    </div>

    <script>
        // Firebase Konfiqurasiyası
        const config = { 
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8", 
            databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "ecopix-118c6" 
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        // 1. Profil İdarəetməsi
        function updateProfile() {
            const name = prompt("Adınız:");
            const bio = prompt("Haqqınızda:");
            if(name) {
                document.getElementById('userName').innerText = name;
                document.getElementById('display-name').innerText = "@" + name.replace(/\s/g, '');
                document.getElementById('userBio').innerText = bio;
                db.ref('aztube_users/myID').set({ name, bio });
            }
        }

        // 2. Mesajlaşma Sistemi (Real-Time)
        function sendMsg() {
            const inp = document.getElementById('msg-input');
            if(!inp.value) return;
            db.ref('aztube_chats').push({ text: inp.value, user: 'me', time: Date.now() });
            inp.value = "";
        }

        db.ref('aztube_chats').on('child_added', s => {
            const d = s.val();
            const box = document.getElementById('chat-box');
            const m = document.createElement('div');
            m.className = `msg ${d.user === 'me' ? 'me' : 'them'}`;
            m.innerText = d.text;
            box.appendChild(m);
            box.scrollTop = box.scrollHeight;
        });

        // 3. Professional Video Yükləmə
        async function triggerUpload() {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'video/*';
            inp.onchange = async (e) => {
                alert("AzTube: Video emal olunur...");
                const fd = new FormData();
                fd.append('file', e.target.files[0]);
                fd.append('upload_preset', 'ml_default');
                try {
                    const res = await fetch('https://api.cloudinary.com/v1_1/dyrfkit3x/video/upload', {method:'POST', body:fd});
                    const data = await res.json();
                    db.ref('aztube_feed').push({ url: data.secure_url, user: 'User', ts: Date.now() });
                    alert("Video yayımlandı! 🇦🇿");
                } catch(err) { alert("Xəta!"); }
            };
            inp.click();
        }

        // UI Keçidləri
        function toggleDM() { const p = document.getElementById('dm-page'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
        function toggleProfile() { const p = document.getElementById('profile-page'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
        function home() { toggleDM(); toggleProfile(); }
    </script>
</body>
</html>

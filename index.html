<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EcoPix Gold v2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff0050; --cyan: #00f2ea; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; overflow: hidden; }
        
        /* Video Feed (Swipe) */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .post { height: 100vh; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* UI Overlays */
        .side-bar { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 100; }
        .ui-btn { background: none; border: none; color: #fff; font-size: 28px; text-shadow: 0 0 5px #000; cursor: pointer; }
        .badge { font-size: 11px; font-weight: bold; }

        /* Live & Stats */
        .live-badge { position: fixed; top: 20px; left: 20px; background: var(--red); padding: 5px 12px; border-radius: 15px; font-weight: bold; z-index: 200; cursor: pointer; }
        .coin-stats { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; color: gold; font-weight: bold; z-index: 200; }

        /* Floating Elements */
        .heart { position: absolute; bottom: 100px; right: 30px; font-size: 24px; animation: flyUp 2s linear forwards; pointer-events: none; }
        @keyframes flyUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-500px) scale(2); opacity: 0; } }

        /* Panels (Music, Chat, Gift) */
        .glass-panel { display: none; position: fixed; bottom: 0; width: 100%; background: rgba(15,15,15,0.95); border-radius: 20px 20px 0 0; z-index: 1000; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="live-badge" onclick="startLive()"><i class="fas fa-tower-broadcast"></i> LIVE</div>
<div class="coin-stats">🪙 <span id="coins">0</span></div>

<div class="feed" id="mainFeed">
    <div class="post">
        <video loop autoplay muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-girl-dancing-under-neon-lights-34405-large.mp4"></video>
        <div class="side-bar">
            <button class="ui-btn" onclick="sendHeart()"><i class="fas fa-heart"></i><div class="badge">12K</div></button>
            <button class="ui-btn" onclick="openPanel('chatPanel')"><i class="fas fa-comment"></i><div class="badge">45</div></button>
            <button class="ui-btn" onclick="openPanel('musicPanel')"><i class="fas fa-music" style="color:var(--cyan)"></i></button>
        </div>
    </div>
</div>

<div id="liveOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:2000; background:#000;">
    <video id="liveVideo" autoplay muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>
    <div style="position:absolute; top:20px; left:20px; background:red; padding:5px 10px; border-radius:5px;">LIVE <span id="vCount">0</span> 👀</div>
    <div class="side-bar">
        <button class="ui-btn" onclick="openPanel('giftPanel')"><i class="fas fa-gift" style="color:gold"></i></button>
        <button class="ui-btn" onclick="stopLive()"><i class="fas fa-times-circle"></i></button>
    </div>
</div>

<div id="musicPanel" class="glass-panel" style="height:50%">
    <h3>🎵 Trend Musiqilər</h3>
    <div id="songList" style="overflow-y:auto; height:80%;">
        <div onclick="selectSong('Meyxana Mix')" style="padding:15px; border-bottom:1px solid #333;">🔥 Meyxana Mix 2026</div>
        <div onclick="selectSong('Global Pop')" style="padding:15px; border-bottom:1px solid #333;">🌍 Global Pop Trend</div>
    </div>
    <button onclick="closePanels()" style="width:100%; color:red; background:none; border:none; margin-top:10px;">Bağla</button>
</div>

<div id="giftPanel" class="glass-panel">
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); text-align:center; gap:15px;">
        <div onclick="sendGift('🌹', 10)">🌹<br>10</div>
        <div onclick="sendGift('🎁', 50)">🎁<br>50</div>
        <div onclick="sendGift('💎', 100)">💎<br>100</div>
        <div onclick="sendGift('🏎️', 500)">🏎️<br>500</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 0;
    let viewers = 0;

    function openPanel(id) { document.getElementById(id).style.display = 'block'; }
    function closePanels() { document.querySelectorAll('.glass-panel').forEach(p => p.style.display = 'none'); }

    function startLive() {
        document.getElementById('liveOverlay').style.display = 'block';
        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => {
            document.getElementById('liveVideo').srcObject = s;
            setInterval(() => { viewers += Math.floor(Math.random()*3); document.getElementById('vCount').innerText = viewers; }, 3000);
        });
    }

    function stopLive() {
        const s = document.getElementById('liveVideo').srcObject;
        if(s) s.getTracks().forEach(t => t.stop());
        document.getElementById('liveOverlay').style.display = 'none';
        viewers = 0;
    }

    function sendHeart() {
        const h = document.createElement('div'); h.className = 'heart'; h.innerHTML = '❤️';
        h.style.left = (Math.random()*40 + 50) + '%';
        document.body.appendChild(h); setTimeout(() => h.remove(), 2000);
    }

    function sendGift(icon, price) {
        balance += price;
        document.getElementById('coins').innerText = balance;
        tg.HapticFeedback.notificationOccurred('success');
        tg.showAlert(`${icon} Göndərildi! Sizin balansınız artdı.`);
        closePanels();
    }

    function selectSong(name) {
        tg.showAlert(name + " seçildi. Paylaşımda və ya canlıda istifadə oluna bilər!");
        closePanels();
    }
</script>
</body>
</html>

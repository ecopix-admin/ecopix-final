<div id="textStylePanel" style="display: none; background: rgba(0,0,0,0.9); padding: 15px; position: absolute; bottom: 80px; width: 100%; z-index: 4000;">
    <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;">
        <button onclick="changeFontFace('serif')" style="font-family: serif;" class="font-btn">Serif</button>
        <button onclick="changeFontFace('cursive')" style="font-family: cursive;" class="font-btn">Cursive</button>
        <button onclick="changeFontFace('monospace')" style="font-family: monospace;" class="font-btn">Mono</button>
        <button onclick="changeFontFace('system-ui')" style="font-family: system-ui;" class="font-btn">Bold</button>
    </div>
    <div style="display: flex; gap: 10px;">
        <div onclick="changeTextColor('#fe2c55')" style="background:#fe2c55;" class="color-dot"></div>
        <div onclick="changeTextColor('#25f4ee')" style="background:#25f4ee;" class="color-dot"></div>
        <div onclick="changeTextColor('#ffff00')" style="background:#ffff00;" class="color-dot"></div>
        <div onclick="changeTextColor('#ffffff')" style="background:#ffffff;" class="color-dot"></div>
    </div>
</div>

<style>
    .font-btn { background: white; color: black; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
    
    /* Yükləmə Progress Bar */
    #uploadProgress {
        display: none; position: fixed; top: 0; left: 0; width: 0%; height: 5px; 
        background: var(--tiktok-cyan); z-index: 5000; transition: width 0.3s;
    }
</style>

<div id="uploadProgress"></div>

<script type="module">
    // Firebase Modullarını İdxal Et
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-storage.js";

    const db = getFirestore();
    const storage = getStorage();

    // 1. Şrift və Rəng Dəyişmə Funksiyaları
    window.addTextToVideo = function() {
        const text = prompt("Yazını daxil edin:");
        if (text) {
            const el = document.getElementById('draggableText');
            el.innerText = text;
            el.style.display = 'block';
            document.getElementById('textStylePanel').style.display = 'block';
            makeDraggable(el);
        }
    };

    window.changeFontFace = (font) => { document.getElementById('draggableText').style.fontFamily = font; };
    window.changeTextColor = (color) => { document.getElementById('draggableText').style.color = color; };

    // 2. REAL FİREBASE PAYLAŞIM FUNKSİYASI
    window.finalPost = async function() {
        const fileInput = document.getElementById('fileInput');
        const desc = document.getElementById('postDescription').value;
        const loc = document.getElementById('postLocation').value;
        const dragText = document.getElementById('draggableText');

        if (!fileInput.files[0]) return alert("Video seçilməyib!");

        const file = fileInput.files[0];
        const fileName = Date.now() + "_" + file.name;
        const storageRef = ref(storage, 'videos/' + fileName);
        
        // Progress barı göstər
        const progressBar = document.getElementById('uploadProgress');
        progressBar.style.display = 'block';

        // A. VİDEONU STORAGE-Ə YÜKLƏ
        const uploadTask = uploadBytesResumable(storageRef, file);

        uploadTask.on('state_changed', 
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressBar.style.width = progress + "%";
            }, 
            (error) => { alert("Yükləmə xətası: " + error.message); }, 
            async () => {
                // B. VİDEO LİNKİNİ GÖTÜR
                const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

                // C. MƏLUMATLARI FİRESTORE-A YAZ
                try {
                    await addDoc(collection(db, "posts"), {
                        videoUrl: downloadURL,
                        description: desc,
                        location: loc,
                        overlayText: dragText.innerText,
                        textColor: dragText.style.color,
                        fontFamily: dragText.style.fontFamily,
                        likes: 0,
                        comments: [],
                        timestamp: serverTimestamp(),
                        owner: "ali" // Hazırkı istifadəçi
                    });
                    
                    alert("Paylaşıldı! 🎉");
                    location.reload(); // Səhifəni yenilə və feed-ə qayıt
                } catch (e) {
                    console.error("Xəta: ", e);
                }
            }
        );
    };
</script>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Panel Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --border: rgba(255, 255, 255, 0.2); }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; text-align: center; overflow-x: hidden; }
        /* Arxa fon videosu */
        .bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; filter: brightness(0.3); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .ad-section { background: rgba(0,0,0,0.8); padding: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .ad-btn { background: #ff9800; color: #000; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block; }
        
        .container { margin-top: 120px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 80vh; }
        .card { background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 40px; width: 100%; max-width: 380px; padding: 70px 20px 30px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        .pfp { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; position: absolute; top: -60px; left: 50%; transform: translateX(-50%); border: 5px solid #000; background: #222; }
        
        .links { width: 100%; display: grid; gap: 12px; margin-top: 20px; }
        .btn { display: flex; align-items: center; padding: 16px; border-radius: 20px; text-decoration: none; color: #fff; font-weight: 600; border: 1px solid var(--border); background: rgba(255,255,255,0.05); transition: 0.3s; }
        .btn i { width: 35px; font-size: 22px; margin-right: 10px; }
        
        /* Rəngli kənarlar */
        .tiktok { border-left: 5px solid #ff0050; } .insta { border-left: 5px solid #e1306c; } 
        .yt { border-left: 5px solid #f00; } .wa { border-left: 5px solid #25d366; } 
        .fb { border-left: 5px solid #1877f2; } .web { border-left: 5px solid #0088cc; }
        
        .footer { margin: 40px 0; }
        .create-btn { background: #0088cc; color: #fff; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; }
        .privacy-link { font-size: 12px; color: #666; margin-top: 20px; display: block; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-video">
        <video autoplay muted loop playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-connection-lines-in-dark-blue-background-30046-large.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="ad-section">
        <div style="font-size: 12px; color: #ccc; margin-bottom: 5px;">Bura reklam yerləşdirə bilərsiz</div>
        <a href="https://t.me/shamkhal_h" class="ad-btn">Müraciət et</a>
    </div>

    <div class="container">
        <div class="card">
            <img id="pfp" src="" class="pfp">
            <h2 id="name">...</h2>
            <div class="links" id="links-box"></div>
        </div>
        <div class="footer">
            <p style="color:#aaa; font-size:14px;">Öz Bio Panelinizi yaratmaq istəyirsiz?</p>
            <a href="https://t.me/BioPanelCreatorBot" class="create-btn"><i class="fab fa-telegram-plane"></i> @BioPanelCreatorBot</a>
            <span class="privacy-link" onclick="alert('1. Panel yaratmaq könüllüdür.\n2. Məlumatlarınız qorunur.\n3. Məzmun məsuliyyəti istifadəçidədir.')">Məxfilik Siyasəti</span>
        </div>
    </div>

    <script>
        const hash = decodeURIComponent(window.location.hash.substring(1));
        if (hash) {
            const p = hash.split('|');
            const name = p[0] || "İstifadəçi";
            const photo = p[1];
            
            document.getElementById('name').innerText = name;
            
            // Şəkil linkini yoxlayırıq
            const pfpImg = document.getElementById('pfp');
            if (!photo || photo.toLowerCase() === 'yox' || !photo.startsWith('http')) {
                pfpImg.src = `https://ui-avatars.com/api/?name=${name}&background=random&color=fff&size=128`;
            } else {
                pfpImg.src = photo;
                pfpImg.onerror = function() {
                    this.src = `https://ui-avatars.com/api/?name=${name}&background=random&color=fff&size=128`;
                };
            }

            let html = '';
            const labels = [
                {v:p[2], c:'tiktok', i:'fa-brands fa-tiktok', n:'TikTok'},
                {v:p[3], c:'insta', i:'fa-brands fa-instagram', n:'Instagram'},
                {v:p[4], c:'yt', i:'fa-brands fa-youtube', n:'YouTube'},
                {v:p[5], c:'fb', i:'fa-brands fa-facebook', n:'Facebook'},
                {v:p[6], c:'wa', i:'fa-brands fa-whatsapp', n:'WhatsApp'},
                {v:p[7], c:'web', i:'fa-solid fa-globe', n:'Website'}
            ];
            
            labels.forEach(l => {
                if(l.v && l.v.toLowerCase() !== 'yox') {
                    let url = l.v;
                    if(l.n === 'WhatsApp') url = 'https://wa.me/' + l.v.replace(/\D/g,'');
                    html += `<a href="${url}" target="_blank" class="btn ${l.c}"><i class="${l.i}"></i> ${l.n}</a>`;
                }
            });
            document.getElementById('links-box').innerHTML = html;
        }
    </script>
</body>
</html>

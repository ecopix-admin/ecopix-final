<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çayxana SuperApp - Shorts & Live</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --accent: #00f2ff; --bg: #050505; --card: #121212; --danger: #ff3b30; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* TOP NAVIGATION */
        .top-nav { background: #000; padding: 15px; border-bottom: 1px solid #222; position: relative; z-index: 100; }
        .search-area { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-area input { flex: 1; background: #111; border: 1px solid #333; padding: 10px 15px; border-radius: 25px; color: white; }
        
        .categories { display: flex; gap: 12px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-item { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .cat-icon { width: 45px; height: 45px; border-radius: 50%; background: var(--card); border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .cat-item span { font-size: 10px; color: #888; }

        /* SHORTS OVERLAY */
        #shorts-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .shorts-container { flex: 1; overflow-y: scroll; snap-type: y mandatory; scrollbar-width: none; }
        .short-video { width: 100%; height: 100%; snap-align: start; position: relative; background: #000; }
        .short-video iframe { width: 100%; height: 100%; pointer-events: none; }

        /* STAGE & DRAGGABLE CAMS */
        .stage { width: 100%; height: 30vh; background: #000; position: relative; }
        #video-grid { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
        .p2p-cam { 
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent); 
            object-fit: cover; background: #000; position: absolute; 
            cursor: move; pointer-events: auto; touch-action: none;
            box-shadow: 0 0 15px rgba(0,242,255,0.4);
        }
        iframe, video { width: 100%; height: 100%; border: none; display: none; }
        .active-view { display: block !important; }

        /* CHAT */
        .chat-view { height: calc(70vh - 210px); overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: var(--card); padding: 10px; border-radius: 12px; border: 1px solid #222; font-size: 14px; max-width: 80%; }
        .msg b { color: var(--accent); font-size: 10px; display: block; }

        /* FOOTER */
        .bottom-tools { position: fixed; bottom: 0; width: 100%; background: #000; padding: 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #222; }
        .action-btn { width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        #list-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; padding: 20px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="search-area">
            <input type="text" id="mainSearch" placeholder="Otaq və ya Kino axtar...">
            <button class="action-btn" onclick="toggleExplore()"><i class="fas fa-compass"></i></button>
            <button class="action-btn" onclick="createNewRoom()"><i class="fas fa-plus-circle"></i></button>
        </div>
        <div class="categories">
            <div class="cat-item" onclick="openShorts()"><div class="cat-icon" style="color:#ff0050"><i class="fab fa-tiktok"></i></div><span>Shorts</span></div>
            <div class="cat-item" onclick="showList('film')"><div class="cat-icon"><i class="fas fa-film"></i></div><span>Kinolar</span></div>
            <div class="cat-item" onclick="showList('idman')"><div class="cat-icon"><i class="fas fa-futbol"></i></div><span>İdman</span></div>
            <div class="cat-item" onclick="showList('tv')"><div class="cat-icon"><i class="fas fa-tv"></i></div><span>TV</span></div>
            <div class="cat-item" onclick="showList('anim')"><div class="cat-icon"><i class="fas fa-dragon"></i></div><span>Cizgi</span></div>
        </div>
    </div>

    <div id="shorts-overlay">
        <div style="position:absolute; top:20px; right:20px; z-index:2100">
            <button class="action-btn" onclick="closeShorts()"><i class="fas fa-times"></i></button>
        </div>
        <div class="shorts-container" id="shorts-wrapper">
            </div>
    </div>

    <div id="list-overlay">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="list-title">Siyahı</h2>
            <button class="action-btn" onclick="closeList()"><i class="fas fa-times"></i></button>
        </div>
        <div id="channel-container" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; overflow-y:auto;"></div>
    </div>

    <div class="stage">
        <div id="video-grid">
            <video id="my-cam" class="p2p-cam" style="display:none; top:10px; left:10px;" autoplay muted playsinline></video>
        </div>
        <iframe id="yt-frame" allow="autoplay; encrypted-media"></iframe>
        <video id="hls-video" controls autoplay muted></video>
    </div>

    <div class="chat-view" id="chat"></div>

    <div class="bottom-tools">
        <button class="action-btn" onclick="document.getElementById('file-in').click()"><i class="fas fa-paperclip"></i></button>
        <input type="file" id="file-in" hidden onchange="uploadMedia(this)">
        <input type="text" id="msg-in" style="flex:1; background:#111; border:none; padding:12px; border-radius:20px; color:white" placeholder="Söhbətə qoşul...">
        <button class="action-btn" id="voice-trigger" onclick="toggleVoiceRoom()"><i class="fas fa-microphone"></i></button>
        <button class="action-btn" onclick="toggleP2PVideo()"><i class="fas fa-video"></i></button>
        <button class="action-btn" style="background:var(--accent); color:black" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script>
        const conf = { apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8", databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app", projectId: "ecopix-118c6" };
        firebase.initializeApp(conf);
        const db = firebase.database();
        
        let nick = localStorage.getItem('v_nick') || "User_" + Math.floor(Math.random()*9999);
        let room = localStorage.getItem('v_room') || "Lobby";
        const peer = new Peer(nick.replace(/\s+/g,'_') + "_" + room);
        let myStream = null;

        // --- SHORTS LOGIC ---
        const shortVideos = ["v64pP7_r9-0", "5_XDiB66P7s", "3D099N-jNHA", "YoHD9XEInc0", "8g18jFHCLXk"];
        function openShorts() {
            const wrap = document.getElementById('shorts-wrapper');
            wrap.innerHTML = "";
            shortVideos.forEach(id => {
                wrap.innerHTML += `<div class="short-video">
                    <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0"></iframe>
                </div>`;
            });
            document.getElementById('shorts-overlay').style.display = "flex";
        }
        function closeShorts() { document.getElementById('shorts-overlay').style.display = "none"; }

        // --- DRAGGABLE LOGIC ---
        function makeDraggable(el) {
            let posX = 0, posY = 0, initialX, initialY;
            el.ontouchstart = dragStart;
            el.onmousedown = dragStart;

            function dragStart(e) {
                e.preventDefault();
                initialX = (e.type === "touchstart") ? e.touches[0].clientX - posX : e.clientX - posX;
                initialY = (e.type === "touchstart") ? e.touches[0].clientY - posY : e.clientY - posY;
                document.onmousemove = drag;
                document.ontouchmove = drag;
                document.onmouseup = dragEnd;
                document.ontouchend = dragEnd;
            }

            function drag(e) {
                posX = (e.type === "touchmove") ? e.touches[0].clientX - initialX : e.clientX - initialX;
                posY = (e.type === "touchmove") ? e.touches[0].clientY - initialY : e.clientY - initialY;
                el.style.transform = `translate(${posX}px, ${posY}px)`;
            }

            function dragEnd() {
                document.onmousemove = document.onmouseup = null;
                document.ontouchmove = document.ontouchend = null;
            }
        }
        makeDraggable(document.getElementById('my-cam'));

        // --- MÖVCUD FUNKSİYALAR (SİLİNMƏYİB) ---
        function createNewRoom() {
            let r = prompt("Otaq adı:");
            if(r) { room = r; localStorage.setItem('v_room', r); location.reload(); }
        }

        async function toggleP2PVideo() {
            if(!myStream) {
                myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                const myCam = document.getElementById('my-cam');
                myCam.srcObject = myStream;
                myCam.style.display = 'block';
                db.ref(`rooms/${room}/speakers/${nick}`).set(true);
            } else {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
                document.getElementById('my-cam').style.display = 'none';
                db.ref(`rooms/${room}/speakers/${nick}`).remove();
            }
        }

        peer.on('call', call => {
            if(myStream) {
                call.answer(myStream);
                call.on('stream', st => addRemoteCam(st, call.peer));
            }
        });

        function addRemoteCam(st, id) {
            if(document.getElementById(id)) return;
            let v = document.createElement('video');
            v.id = id; v.className = "p2p-cam"; v.srcObject = st; v.autoplay = true;
            v.style.bottom = "10px"; v.style.right = "10px";
            document.getElementById('video-grid').appendChild(v);
            makeDraggable(v); // Digər gələn kameraları da sürüşdürmək olar
        }

        // --- KANAL VE SYNC ---
        const dbChannels = {
            film: [{n: "Avatar 2", id: "55yc5C84S48", t: "yt"}, {n: "Dune", id: "8g18jFHCLXk", t: "yt"}],
            idman: [{n: "CBC Sport", id: "j_SInXN2Fas", t: "yt"}],
            tv: [{n: "Kino Kanal 1", id: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", t: "hls"}],
            anim: [{n: "Cizgi Film 1", id: "5_XDiB66P7s", t: "yt"}]
        };

        function showList(cat) {
            const container = document.getElementById('channel-container');
            container.innerHTML = "";
            dbChannels[cat].forEach(ch => {
                container.innerHTML += `<div class="ch-card" onclick="selectMedia('${ch.t}', '${ch.id}')">
                    <img src="https://img.youtube.com/vi/${ch.id}/0.jpg">
                    <div style="padding:5px; font-size:12px;">${ch.n}</div>
                </div>`;
            });
            document.getElementById('list-overlay').style.display = "flex";
        }
        function closeList() { document.getElementById('list-overlay').style.display = "none"; }
        function selectMedia(type, id) { db.ref(`rooms/${room}/media`).set({type, id}); closeList(); }

        db.ref(`rooms/${room}/media`).on('value', s => {
            const d = s.val() || {type: 'yt', id: 'j_SInXN2Fas'};
            const yt = document.getElementById('yt-frame'); const tv = document.getElementById('hls-video');
            yt.classList.remove('active-view'); tv.classList.remove('active-view');
            if(d.type === 'yt') { yt.src = `https://www.youtube.com/embed/${d.id}?autoplay=1&mute=1`; yt.classList.add('active-view'); }
            else { tv.classList.add('active-view'); if(Hls.isSupported()){ let h=new Hls(); h.loadSource(d.id); h.attachMedia(tv); }}
        });

        function sendMessage() {
            let i = document.getElementById('msg-in');
            if(i.value) { db.ref(`rooms/${room}/msgs`).push({user: nick, text: i.value, time: Date.now()}); i.value = ""; }
        }
        db.ref(`rooms/${room}/msgs`).on('child_added', snap => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = 'msg'; div.innerHTML = `<b>${d.user}</b> ${d.text}`;
            document.getElementById('chat').appendChild(div);
            document.getElementById('chat').scrollTop = 9999;
        });
    </script>
</body>
</html>

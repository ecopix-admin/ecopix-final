<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çayxana Ultimate - Pro Media Hub</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --accent: #00f2ff; --bg: #050505; --card: #121212; --danger: #ff3b30; --grad: linear-gradient(135deg, #00f2ff, #0072ff); }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* HEADER & SEARCH */
        .top-nav { background: #000; padding: 10px 15px; border-bottom: 1px solid #222; z-index: 100; }
        .search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .search-bar { flex: 1; background: #111; border: 1px solid #333; padding: 10px 15px; border-radius: 20px; color: white; display: flex; align-items: center; }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; padding-left: 10px; }
        
        /* CATEGORIES */
        .categories { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .cat-item { flex-shrink: 0; text-align: center; cursor: pointer; }
        .cat-icon { width: 45px; height: 45px; border-radius: 12px; background: var(--card); border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 4px; transition: 0.3s; }
        .cat-item:active .cat-icon { border-color: var(--accent); color: var(--accent); }
        .cat-item span { font-size: 10px; color: #888; }

        /* PLAYER STAGE */
        .stage { width: 100%; height: 32vh; background: #000; position: relative; overflow: hidden; border-bottom: 1px solid #222; }
        iframe, video { width: 100%; height: 100%; border: none; display: none; }
        .active-view { display: block !important; }

        /* DRAGGABLE & ZOOMABLE CAMS */
        #video-grid { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
        .p2p-cam { 
            width: 75px; height: 75px; border-radius: 50%; border: 2px solid var(--accent); 
            object-fit: cover; background: #000; position: absolute; 
            cursor: move; pointer-events: auto; touch-action: none;
            box-shadow: 0 0 10px rgba(0,242,255,0.3); transition: width 0.3s, height 0.3s, border-radius 0.3s;
        }
        .cam-zoomed { width: 100% !important; height: 100% !important; border-radius: 0 !important; top: 0 !important; left: 0 !important; z-index: 100; transform: none !important; }
        .back-btn-cam { position: absolute; top: 10px; left: 10px; z-index: 110; display: none; background: rgba(0,0,0,0.7); border: 1px solid var(--accent); color: white; padding: 5px 10px; border-radius: 5px; }

        /* OVERLAYS (SHORTS, GAMES, MUSIC, LISTS) */
        .full-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .overlay-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .scroll-grid { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .shorts-wrapper { flex: 1; overflow-y: scroll; snap-type: y mandatory; }
        .short-item { width: 100%; height: 100%; snap-align: start; background: #000; position: relative; }

        /* CHAT SECTION */
        .chat-area { height: calc(68vh - 160px); display: flex; flex-direction: column; background: #080808; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #151515; padding: 10px; border-radius: 12px; border: 1px solid #222; font-size: 13px; max-width: 85%; }
        .msg.me { align-self: flex-end; border-color: var(--accent); background: #1a1a1a; }
        .msg b { font-size: 9px; color: var(--accent); display: block; margin-bottom: 3px; }
        .msg img { width: 100%; border-radius: 8px; margin-top: 5px; }

        /* BOTTOM TOOLS */
        .footer { background: #000; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #222; }
        .action-btn { width: 42px; height: 42px; border-radius: 50%; background: #18181b; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
        .btn-main { background: var(--grad); color: #000; font-weight: bold; }
        .active-red { background: var(--danger) !important; box-shadow: 0 0 10px var(--danger); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="search-row">
            <div class="search-bar">
                <i class="fas fa-search" style="color:#555"></i>
                <input type="text" id="globalSearch" placeholder="Otaq və ya Kino axtar...">
                <i class="fas fa-times" onclick="document.getElementById('globalSearch').value=''" style="cursor:pointer"></i>
            </div>
            <button class="action-btn" onclick="showRoomsList()"><i class="fas fa-layer-group"></i></button>
            <button class="action-btn" onclick="toggleNotif()" id="notifBtn"><i class="fas fa-bell"></i></button>
        </div>
        <div class="categories">
            <div class="cat-item" onclick="openFull('shorts')"><div class="cat-icon" style="color:#ff0050"><i class="fab fa-tiktok"></i></div><span>Shorts</span></div>
            <div class="cat-item" onclick="showList('film')"><div class="cat-icon"><i class="fas fa-film"></i></div><span>Kinolar</span></div>
            <div class="cat-item" onclick="showList('tv')"><div class="cat-icon"><i class="fas fa-tv"></i></div><span>TV</span></div>
            <div class="cat-item" onclick="showList('idman')"><div class="cat-icon"><i class="fas fa-futbol"></i></div><span>İdman</span></div>
            <div class="cat-item" onclick="openFull('games')"><div class="cat-icon" style="color:#00ff00"><i class="fas fa-gamepad"></i></div><span>Oyunlar</span></div>
            <div class="cat-item" onclick="openFull('music')"><div class="cat-icon" style="color:#ff00ff"><i class="fas fa-music"></i></div><span>Musiqi</span></div>
        </div>
    </div>

    <div class="stage">
        <button id="camBackBtn" class="back-btn-cam" onclick="minimizeCam()"><i class="fas fa-compress"></i> Geri</button>
        <div id="video-grid">
            <video id="my-cam" class="p2p-cam" style="display:none; top:10px; left:10px;" autoplay muted playsinline onclick="zoomCam(this)"></video>
        </div>
        <iframe id="yt-player" allow="autoplay; encrypted-media"></iframe>
        <video id="hls-player" controls autoplay muted></video>
    </div>

    <div class="chat-area">
        <div class="messages" id="msgBox"></div>
        <div class="footer">
            <label class="action-btn"><i class="fas fa-plus"></i><input type="file" hidden id="fileInp" onchange="uploadToCloud(this)"></label>
            <input type="text" id="msgInp" style="flex:1; background:#18181b; border:none; padding:12px; border-radius:20px; color:white" placeholder="Mesaj yazın...">
            <button class="action-btn" id="voiceBtn" onclick="toggleVoice()"><i class="fas fa-microphone"></i></button>
            <button class="action-btn" id="camBtn" onclick="toggleCamera()"><i class="fas fa-video"></i></button>
            <button class="action-btn btn-main" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="shortsOverlay" class="full-overlay">
        <div class="overlay-header"><h2>Shorts Feed</h2><button class="action-btn" onclick="closeFull('shorts')"><i class="fas fa-times"></i></button></div>
        <div class="shorts-wrapper" id="shortsList"></div>
    </div>

    <div id="listOverlay" class="full-overlay">
        <div class="overlay-header"><h2 id="listTitle">Siyahı</h2><button class="action-btn" onclick="closeList()"><i class="fas fa-times"></i></button></div>
        <div class="scroll-grid" id="listGrid"></div>
    </div>

    <div id="gamesOverlay" class="full-overlay">
        <div class="overlay-header"><h2>Oyunlar</h2><button class="action-btn" onclick="closeFull('games')"><i class="fas fa-times"></i></button></div>
        <div class="scroll-grid">
            <div class="cat-item" onclick="loadGame('https://m.gamesnacks.com/games/2048/')"><div class="cat-icon">🎮</div><span>2048</span></div>
            <div class="cat-item" onclick="loadGame('https://m.gamesnacks.com/games/omnomrun/')"><div class="cat-icon">🏃</div><span>Om Nom</span></div>
            <div class="cat-item" onclick="loadGame('https://m.gamesnacks.com/games/towerbuild/')"><div class="cat-icon">🏗️</div><span>Tower</span></div>
        </div>
        <iframe id="gameFrame" style="width:100%; flex:1; display:none; border:none;"></iframe>
    </div>

    <script>
        // FIREBASE SETUP
        const conf = { apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8", databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app", projectId: "ecopix-118c6" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let nick = localStorage.getItem('v_nick') || "User_" + Math.floor(Math.random()*9999);
        let room = localStorage.getItem('v_room') || "Lobby";
        let notifActive = localStorage.getItem('notif') === 'true';
        
        const peer = new Peer(nick.replace(/\s+/g,'_') + "_" + room);
        let myStream = null;

        // --- NOTIFICATION SYSTEM ---
        function toggleNotif() {
            notifActive = !notifActive;
            localStorage.setItem('notif', notifActive);
            document.getElementById('notifBtn').style.color = notifActive ? "var(--accent)" : "white";
            if(notifActive) Notification.requestPermission();
        }

        function pushNotif(user, text) {
            if(notifActive && document.hidden) {
                new Notification(user, { body: text, icon: 'https://cdn-icons-png.flaticon.com/512/2598/2598851.png' });
            }
        }

        // --- CAMERA & DRAGGABLE LOGIC ---
        async function toggleCamera() {
            if(!myStream) {
                myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                const myCam = document.getElementById('my-cam');
                myCam.srcObject = myStream;
                myCam.style.display = 'block';
                document.getElementById('camBtn').classList.add('active-red');
                db.ref(`rooms/${room}/users/${nick}`).set({active: true});
                // Connect to existing users
                db.ref(`rooms/${room}/users`).once('value', s => {
                    s.forEach(child => { if(child.key !== nick) peer.call(child.key.replace(/\s+/g,'_') + "_" + room, myStream); });
                });
            } else {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
                document.getElementById('my-cam').style.display = 'none';
                document.getElementById('camBtn').classList.remove('active-red');
                db.ref(`rooms/${room}/users/${nick}`).remove();
            }
        }

        peer.on('call', call => {
            if(myStream) {
                call.answer(myStream);
                call.on('stream', st => addRemoteCam(st, call.peer));
            }
        });

        function addRemoteCam(st, id) {
            if(document.getElementById(id)) return;
            let v = document.createElement('video');
            v.id = id; v.className = "p2p-cam"; v.srcObject = st; v.autoplay = true; v.playsinline = true;
            v.style.top = Math.random()*100 + "px"; v.style.left = Math.random()*100 + "px";
            v.onclick = () => zoomCam(v);
            document.getElementById('video-grid').appendChild(v);
            makeDraggable(v);
        }

        function zoomCam(el) {
            el.classList.add('cam-zoomed');
            document.getElementById('camBackBtn').style.display = 'block';
        }

        function minimizeCam() {
            document.querySelectorAll('.p2p-cam').forEach(v => v.classList.remove('cam-zoomed'));
            document.getElementById('camBackBtn').style.display = 'none';
        }

        function makeDraggable(el) {
            let posX = 0, posY = 0, initialX, initialY;
            el.ontouchstart = e => {
                initialX = e.touches[0].clientX - posX; initialY = e.touches[0].clientY - posY;
                document.ontouchmove = e => {
                    posX = e.touches[0].clientX - initialX; posY = e.touches[0].clientY - initialY;
                    el.style.transform = `translate(${posX}px, ${posY}px)`;
                };
            };
            el.ontouchend = () => document.ontouchmove = null;
        }
        makeDraggable(document.getElementById('my-cam'));

        // --- SHORTS & GAMES ---
        function openFull(type) {
            document.getElementById(type+'Overlay').style.display = 'flex';
            if(type === 'shorts') {
                const wrap = document.getElementById('shortsList');
                wrap.innerHTML = "";
                ["v64pP7_r9-0", "5_XDiB66P7s", "3D099N-jNHA", "YoHD9XEInc0"].forEach(id => {
                    wrap.innerHTML += `<div class="short-item"><iframe src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0"></iframe></div>`;
                });
            }
        }
        function closeFull(type) { document.getElementById(type+'Overlay').style.display = 'none'; }
        function loadGame(url) {
            const f = document.getElementById('gameFrame');
            f.src = url; f.style.display = 'block';
        }

        // --- CONTENT & SYNC ---
        const channels = {
            film: Array.from({length: 20}, (_, i) => ({n: "Kino "+(i+1), id: "YoHD9XEInc0", t: "yt"})),
            idman: [{n: "CBC Sport", id: "j_SInXN2Fas", t: "yt"}, {n: "TRT Spor", id: "v64pP7_r9-0", t: "yt"}]
        };

        function showList(cat) {
            const grid = document.getElementById('listGrid'); grid.innerHTML = "";
            document.getElementById('listTitle').innerText = cat.toUpperCase();
            (channels[cat] || []).forEach(ch => {
                grid.innerHTML += `<div class="msg" style="cursor:pointer" onclick="selectContent('${ch.t}','${ch.id}')"><b>${ch.n}</b></div>`;
            });
            document.getElementById('listOverlay').style.display = 'flex';
        }
        function selectContent(type, id) { db.ref(`rooms/${room}/media`).set({type, id}); closeList(); }
        function closeList() { document.getElementById('listOverlay').style.display = 'none'; }

        db.ref(`rooms/${room}/media`).on('value', s => {
            const d = s.val() || {type:'yt', id:'j_SInXN2Fas'};
            const yt = document.getElementById('yt-player'); const tv = document.getElementById('hls-player');
            yt.classList.remove('active-view'); tv.classList.remove('active-view');
            if(d.type==='yt') { yt.src=`https://www.youtube.com/embed/${d.id}?autoplay=1&mute=1`; yt.classList.add('active-view'); }
            else { tv.classList.add('active-view'); if(Hls.isSupported()){ let h=new Hls(); h.loadSource(d.id); h.attachMedia(tv); }}
        });

        // --- CHAT & FILES ---
        async function uploadToCloud(input) {
            const file = input.files[0]; if(!file) return;
            const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', 'ml_default');
            const res = await fetch(`https://api.cloudinary.com/v1_1/dyrfkit3x/auto/upload`, { method:'POST', body:fd });
            const data = await res.json();
            db.ref(`rooms/${room}/msgs`).push({user: nick, url: data.secure_url, type: file.type.split('/')[0], time: Date.now()});
        }

        function sendMsg() {
            let i = document.getElementById('msgInp');
            if(i.value) { db.ref(`rooms/${room}/msgs`).push({user: nick, text: i.value, type: 'text', time: Date.now()}); i.value = ""; }
        }

        db.ref(`rooms/${room}/msgs`).limitToLast(20).on('child_added', snap => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${d.user === nick ? 'me' : ''}`;
            div.innerHTML = `<b>${d.user}</b> ${d.type === 'text' ? d.text : `<img src="${d.url}">`}`;
            document.getElementById('msgBox').appendChild(div);
            document.getElementById('msgBox').scrollTop = 9999;
            if(d.user !== nick) pushNotif(d.user, d.text || "Şəkil göndərdi");
        });

        function showRoomsList() {
            let r = prompt("Yeni otaq adı və ya mövcud otağa keçid:");
            if(r) { localStorage.setItem('v_room', r); location.reload(); }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AzTube - Canlı Yayım Portalı</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --tiktok-red: #ff0050; --tiktok-cyan: #00f2ea; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        
        /* Video Feed */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .post { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #111; }
        
        /* Sidebar Buttons */
        .sidebar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .action-btn { background: none; border: none; color: white; font-size: 28px; text-shadow: 1px 1px 5px #000; }
        .count { font-size: 12px; margin-top: 5px; }

        /* Live Indicator (Yanıb-sönən) */
        .live-badge { position: absolute; top: 20px; left: 20px; background: var(--tiktok-red); padding: 5px 12px; border-radius: 5px; font-weight: bold; animation: pulse 1.5s infinite; z-index: 100; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Bottom Nav */
        .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #333; }
        .plus-btn { background: linear-gradient(to right, var(--tiktok-cyan) 20%, var(--tiktok-red) 80%); padding: 5px 15px; border-radius: 10px; color: black; font-weight: bold; font-size: 20px; }

        /* Upload Overlay */
        #uploadModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; padding: 20px; box-sizing: border-box; }
        .music-picker { background: #222; padding: 10px; border-radius: 10px; margin: 15px 0; overflow-x: auto; white-space: nowrap; }
        .genre { display: inline-block; padding: 8px 15px; background: #444; border-radius: 20px; margin-right: 10px; cursor: pointer; }
        .genre.active { background: var(--tiktok-red); }
    </style>
</head>
<body>

<div class="live-badge" onclick="showLives()"><i class="fas fa-tower-broadcast"></i> LIVE</div>

<div class="feed" id="mainFeed">
    <div class="post">
        <video width="100%" height="100%" loop autoplay muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-girl-dancing-under-neon-lights-34405-large.mp4"></video>
        <div class="sidebar">
            <button class="action-btn"><i class="fas fa-heart"></i><div class="count">45.2K</div></button>
            <button class="action-btn"><i class="fas fa-comment"></i><div class="count">1.2K</div></button>
            <button class="action-btn"><i class="fas fa-share"></i><div class="count">Share</div></button>
        </div>
    </div>
</div>

<nav class="nav">
    <i class="fas fa-home" style="font-size: 24px;"></i>
    <i class="fas fa-search" style="font-size: 24px;"></i>
    <div class="plus-btn" onclick="openUpload()"><i class="fas fa-plus"></i></div>
    <i class="fas fa-message" style="font-size: 24px;"></i>
    <i class="fas fa-user" style="font-size: 24px;"></i>
</nav>

<div id="uploadModal">
    <h2 style="text-align: center;">Yeni Paylaşım</h2>
    <div id="videoPreview" style="width: 100%; height: 200px; border: 2px dashed #444; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
        Video Seçin
    </div>
    <input type="file" id="vInput" accept="video/*" hidden>
    
    <h3>Musiqi Seçimi (Trend)</h3>
    <div class="music-picker">
        <div class="genre" onclick="playMusic('meyxana')">🔥 Meyxana Trend</div>
        <div class="genre" onclick="playMusic('pop')">🎵 Pop Azərbaycan</div>
        <div class="genre" onclick="playMusic('retro')">📻 Klassik 80-ci illər</div>
        <div class="genre" onclick="playMusic('dance')">💃 Rəqs Mix</div>
    </div>

    <textarea placeholder="Açıqlama yazın... #ustalar #aztube #baku" style="width: 100%; height: 80px; background: #222; color: #fff; border: none; border-radius: 10px; padding: 10px;"></textarea>
    
    <button onclick="publishPost()" style="width: 100%; background: var(--tiktok-red); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 20px;">Paylaş</button>
    <button onclick="closeUpload()" style="width: 100%; background: none; color: #888; border: none; margin-top: 10px;">Ləğv et</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function openUpload() { document.getElementById('uploadModal').style.display = 'block'; }
    function closeUpload() { document.getElementById('uploadModal').style.display = 'none'; }

    function playMusic(genre) {
        tg.HapticFeedback.impactOccurred('medium');
        tg.showAlert(genre + " janrında musiqi videoya tətbiq edildi!");
    }

    function publishPost() {
        tg.showConfirm("Videonuz trendlərə əlavə edilsin?", (res) => {
            if(res) {
                tg.showAlert("Təbriklər! Videonuz paylaşıldı.");
                closeUpload();
            }
        });
    }

    // P2P Canlı Yayım Siyahısı (Simulyasiya)
    function showLives() {
        tg.showAlert("Hazırda 12 nəfər canlı yayındadır. Sürüşdürərək keçid edin.");
    }
</script>
</body>
</html>

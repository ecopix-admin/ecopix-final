<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix - Rəqəmsal İmperiya</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root { --neon: #00fbff; --trend: #ff0055; }
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }

        /* 1. Məxfilik Divarı */
        #legalModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #111; padding: 20px; width: 90%; max-height: 80%; overflow-y: auto; border: 1px solid var(--neon); border-radius: 15px; text-align: center; }

        /* 2. Profil Səhifəsi */
        .profile-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; overflow-y: auto; }
        .profile-header { text-align: center; padding: 40px 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--neon); }

        /* 3. Feed və Canlı Yayım Animasiyaları */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .side-bar { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        
        #giftOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5000; }
        .titanic-anim { position: absolute; bottom: 10%; left: -200px; width: 300px; animation: boatSlide 5s linear forwards; }
        @keyframes boatSlide { 0% { left: -200px; opacity: 0; } 50% { opacity: 1; } 100% { left: 110%; opacity: 0; } }
        .floating-heart { position: absolute; bottom: 60px; right: 20px; color: red; font-size: 24px; animation: floatUp 2s forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-400px) scale(1.5); opacity: 0; } }

        /* 4. Video Redaktor (Edit Paneli) */
        #editorModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 20000; overflow-y: auto; padding: 20px; }
        .text-overlay { position: absolute; color: white; border: 1px dashed white; padding: 5px; font-weight: bold; font-size: 20px; text-shadow: 2px 2px 4px #000; }

        /* 5. Naviqasiya Alt Menyu */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 9000; }
        .upload-btn { width: 50px; height: 35px; background: linear-gradient(90deg, #00fbff, #ff0055); border-radius: 10px; color: #000; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="legalModal">
        <div class="modal-content">
            <h2>Məxfilik Siyasəti</h2>
            <p style="font-size: 13px;">(1000 sözlük qanuni mətn) EcoPix ailəsinə qoşulmaqla siz bütün qaydaları qəbul edirsiniz. Paylaşılan məzmun istifadəçinin məsuliyyətindədir.</p>
            <button onclick="acceptLegal()" style="background: var(--neon); padding: 10px 30px; border-radius: 20px; font-weight: bold;">OXUDUM VƏ QƏBUL EDİRƏM</button>
        </div>
    </div>

    <div id="giftOverlay"></div>

    <div class="feed" id="mainFeed"></div>

    <div class="profile-page" id="profilePage">
        <div style="padding: 15px;" onclick="closeProfile()">🔙 Geri</div>
        <div class="profile-header">
            <img src="https://via.placeholder.com/100" class="avatar">
            <h3>@shamxal_hasanov</h3>
            <p>EcoPix Qurucusu | Digital Expert</p>
            <div style="display:flex; justify-content:center; gap:20px;">
                <div><b>150K</b><br>İzləyici</div>
                <div><b>500K</b><br>Bəyəni</div>
            </div>
        </div>
    </div>

    <div id="editorModal">
        <h3 style="text-align:center;">EcoPix Studio v4</h3>
        <div style="position: relative; width: 100%; max-width: 400px; height: 60vh; margin: 0 auto; background: #000;" id="editorCanvas">
            <video id="editorVideo" loop style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>
        
        <div style="text-align:center; margin-top: 15px;">
            <input type="text" id="addText" placeholder="Videonun üstünə yazı yaz..." style="padding:10px; width:80%;">
            <button onclick="applyText()" style="padding:10px; background:var(--neon); border:none; border-radius:5px; margin-top:5px;">Yazını Əlavə Et</button>
            <br><br>
            <label>Orijinal Səs: <input type="range" id="origVol" min="0" max="1" step="0.1" value="1"></label><br>
            <button onclick="alert('30 Mahnılıq Kitabxana açılır...')" style="padding:5px 15px; margin-top:5px;">🎵 Sistem Musiqisi Seç</button>
            <br><br>
            <input type="text" id="caption" placeholder="Açıqlama və #heşteqlər..." style="width:90%; padding:10px; margin-bottom:5px;">
            <input type="text" id="location" placeholder="📍 Məkan əlavə et" style="width:90%; padding:10px;">
            <br><br>
            <button onclick="uploadProcess()" style="width:90%; padding:15px; background:var(--trend); color:white; font-weight:bold; border-radius:10px; border:none;">PAYLAŞ</button>
        </div>
    </div>

    <div class="nav-bar">
        <div onclick="location.reload()">🏠</div>
        <div onclick="alert('Kəşf et bölməsi (30 trend mövzu) hazırlanır...')">🔍</div>
        <div class="upload-btn" onclick="openUpload()">+</div>
        <div onclick="showMusicList()">🎵</div>
        <div onclick="document.getElementById('profilePage').style.display='block'">👤</div>
    </div>

    <script>
        // Firebase Konfiqurasiyası
        const firebaseConfig = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            authDomain: "ecopix-118c6.firebaseapp.com",
            projectId: "ecopix-118c6",
            storageBucket: "ecopix-118c6.firebasestorage.app",
            messagingSenderId: "703699419893",
            appId: "1:703699419893:web:278c140c02b29745787bbc"
        };
        firebase.initializeApp(firebaseConfig);

        // --- HAZIR BAZA MƏLUMATLARI (VİDEO VƏ MUSİQİ) ---
        const sampleVideos = [
            "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lighting-in-the-rain-31242-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-young-man-dancing-in-the-street-at-night-34539-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-woman-dancing-under-neon-lights-34407-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-man-dancing-happy-in-the-street-34542-large.mp4"
        ];

        const sampleMusic = ["🎵 Trend Mix", "🎵 Baku Night", "🎵 EcoPix Special", "🎵 Pop Remix", "🎵 Meyxana 2026", "🎵 Chill Vibes"];

        // Videoları Feed-ə doldurmaq (30 ədəd)
        function initFeed() {
            const feed = document.getElementById('mainFeed');
            for(let i=0; i<30; i++) {
                let vUrl = sampleVideos[i % sampleVideos.length];
                feed.innerHTML += `
                    <div class="v-card">
                        <video src="${vUrl}" loop onclick="this.paused ? this.play() : this.pause()"></video>
                        <div style="position: absolute; bottom: 80px; left: 10px; z-index:5;">
                            <b>@istifadeci_${i+1}</b><br><small>Möhtəşəm anlar! #EcoPix #Trend</small>
                        </div>
                        <div class="side-bar">
                            <div onclick="sendHeart()">❤️<br>${Math.floor(Math.random()*20)}K</div>
                            <div onclick="alert('Şərhlər yüklənir...')">💬<br>${Math.floor(Math.random()*500)}</div>
                            <div onclick="sendTitanic()">🚢<br>Hədiyyə</div>
                            <div onclick="alert('Link kopyalandı!')">🔗</div>
                        </div>
                    </div>
                `;
            }
        }

        // FUNKSİYALAR
        function acceptLegal() { document.getElementById('legalModal').style.display = 'none'; }
        
        function sendTitanic() {
            const ship = document.createElement('div');
            ship.className = 'titanic-anim';
            ship.innerHTML = '🚢 <span style="color:white; font-size:15px; font-weight:bold;">TİTANİK!</span>';
            document.getElementById('giftOverlay').appendChild(ship);
            setTimeout(() => ship.remove(), 5000);
        }

        function sendHeart() {
            const h = document.createElement('div');
            h.className = 'floating-heart'; h.innerHTML = '❤️';
            h.style.right = (Math.random() * 60 + 20) + 'px';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 2000);
        }

        function openUpload() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'video/mp4';
            input.click();
            input.onchange = (e) => {
                document.getElementById('editorModal').style.display = 'block';
                document.getElementById('editorVideo').src = URL.createObjectURL(e.target.files[0]);
                document.getElementById('editorVideo').play();
            }
        }

        function applyText() {
            const t = document.getElementById('addText').value;
            if(!t) return;
            const div = document.createElement('div');
            div.className = 'text-overlay'; div.innerText = t;
            div.style.top = '30%'; div.style.left = '20%';
            document.getElementById('editorCanvas').appendChild(div);
        }

        function showMusicList() {
            alert("EcoPix Musiqi Bazası (30 Mahnı):\n" + sampleMusic.join("\n") + "\n...");
        }

        function uploadProcess() {
            alert("Video FFmpeg ilə sıxılır (MB azaldılır) və Firestore-a göndərilir...");
            setTimeout(() => { alert("Uğurla paylaşıldı!"); location.reload(); }, 2000);
        }

        function closeProfile() { document.getElementById('profilePage').style.display = 'none'; }

        window.onload = initFeed;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix | Sürətli Video Platforması</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100%; }
        
        /* Video Feed */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -ms-overflow-style: none; }
        .feed::-webkit-scrollbar { display: none; }
        
        .v-card { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Sağ Panel İkonları */
        .side-icons { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 10; }
        .icon-group { text-align: center; cursor: pointer; }
        .icon-group span { font-size: 38px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); transition: 0.2s; }
        .icon-group span:active { transform: scale(0.8); }
        .icon-group p { font-size: 12px; margin-top: 2px; font-weight: bold; }
        .v-avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 5px; object-fit: cover; }

        /* Məlumat Paneli (Sol Alt) */
        .v-info { position: absolute; bottom: 80px; left: 15px; z-index: 10; width: 75%; pointer-events: none; }
        .v-info b { font-size: 16px; display: block; margin-bottom: 5px; text-shadow: 0 1px 3px #000; }
        .v-info p { font-size: 14px; opacity: 0.9; line-height: 1.4; text-shadow: 0 1px 3px #000; }

        /* Alt Naviqasiya */
        .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; border-top: 0.5px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav span { font-size: 28px; color: #888; cursor: pointer; }
        .nav .active { color: #fff; }

        /* TikTok Plus Düyməsi */
        .plus { background: #fff; width: 45px; height: 28px; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 24px; cursor: pointer; }
        .plus::before { content: ''; position: absolute; left: -3px; top: 0; width: 100%; height: 100%; background: var(--tt-cyan); border-radius: 8px; z-index: -1; }
        .plus::after { content: ''; position: absolute; right: -3px; top: 0; width: 100%; height: 100%; background: var(--tt-red); border-radius: 8px; z-index: -1; }

        /* Yükləmə Statusu */
        #statusToast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--tt-red); color: #fff; padding: 12px 25px; border-radius: 30px; z-index: 2000; display: none; font-weight: bold; box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4); }
    </style>
</head>
<body>

    <div id="statusToast">Video Yüklənir... 🚀</div>

    <div class="feed" id="mainFeed">
        </div>

    <div class="nav">
        <span class="material-icons-round active">home</span>
        <span class="material-icons-round">explore</span>
        <div class="plus" onclick="document.getElementById('videoInput').click()">+</div>
        <span class="material-icons-round">chat_bubble_outline</span>
        <span class="material-icons-round">person_outline</span>
    </div>

    <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="handleUpload(this)">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // 1. KONFİQURASİYA (Öz məlumatlarınla yoxla)
        const firebaseConfig = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            authDomain: "ecopix-118c6.firebaseapp.com",
            projectId: "ecopix-118c6",
            storageBucket: "ecopix-118c6.firebasestorage.app",
            messagingSenderId: "703699419893",
            appId: "1:703699419893:web:278c140c02b29745787bbc"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CLOUD_NAME = "demo"; // Cloudinary adın
        const UPLOAD_PRESET = "unsigned_preset"; // Cloudinary preset-in

        // 2. VİDEO YÜKLƏMƏ (Cloudinary-yə)
        window.handleUpload = async (input) => {
            const file = input.files[0];
            if(!file) return;

            const toast = document.getElementById('statusToast');
            toast.style.display = 'block';
            toast.innerText = "Video Hazırlanır... ⏳";

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if(data.secure_url) {
                    await addDoc(collection(db, "posts"), {
                        videoUrl: data.secure_url,
                        desc: "Yeni EcoPix kəşfi! ✨",
                        likes: Math.floor(Math.random() * 100),
                        user: "shamxal_hasanov",
                        time: serverTimestamp()
                    });
                    toast.innerText = "Paylaşıldı! ✅";
                    setTimeout(() => toast.style.display = 'none', 2000);
                }
            } catch (err) {
                toast.innerText = "Xəta! ❌";
                setTimeout(() => toast.style.display = 'none', 2000);
            }
        };

        // 3. VİDEOLARI ÇƏKMƏK VƏ AVTOMATİK SƏS SİSTEMİ
        const q = query(collection(db, "posts"), orderBy("time", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('mainFeed');
            feed.innerHTML = ""; 

            snapshot.forEach((doc) => {
                const post = doc.data();
                const card = `
                    <div class="v-card">
                        <video src="${post.videoUrl}" loop playsinline muted onclick="toggleMute(this)"></video>
                        <div class="side-icons">
                            <img src="https://via.placeholder.com/100" class="v-avatar">
                            <div class="icon-group" onclick="this.style.color='var(--tt-red)'">
                                <span class="material-icons-round">favorite</span>
                                <p>${post.likes}</p>
                            </div>
                            <div class="icon-group">
                                <span class="material-icons-round">chat_bubble</span>
                                <p>12</p>
                            </div>
                            <div class="icon-group" onclick="shareVideo('${post.videoUrl}')">
                                <span class="material-icons-round">reply</span>
                                <p>Paylaş</p>
                            </div>
                        </div>
                        <div class="v-info">
                            <b>@${post.user}</b>
                            <p>${post.desc}</p>
                        </div>
                    </div>`;
                feed.insertAdjacentHTML('beforeend', card);
            });

            startObserver();
        });

        // 4. MÜKƏMMƏL SƏS VƏ PLEYER NƏZARƏTİ
        function startObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const v = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        v.muted = false; // Səsi açmağa çalış
                        v.play().catch(() => {
                            v.muted = true; // Əgər brauzer bloklasa, səssiz başlat
                            v.play();
                        });
                    } else {
                        v.pause();
                        v.currentTime = 0;
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.v-card').forEach(c => observer.observe(c));
        }

        window.toggleMute = (v) => {
            v.muted = !v.muted;
        };

        window.shareVideo = async (url) => {
            if (navigator.share) await navigator.share({title: 'EcoPix', url: url});
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix | Real-Time P2P & PK</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100%; }
        
        .page { display: none; height: 100vh; width: 100%; position: absolute; top: 0; }
        .active-page { display: block; }

        /* Video Feed */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .v-card { height: 100vh; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Canlı Yayım (PK Mode) */
        #liveContainer { position: relative; height: 100vh; background: #111; display: flex; flex-direction: column; }
        .video-grid { display: flex; flex-direction: column; height: 80%; gap: 2px; background: #333; }
        .live-video { flex: 1; background: #000; position: relative; overflow: hidden; }
        video.remote { border-top: 3px solid var(--tt-cyan); }
        .pk-bar { height: 10px; background: linear-gradient(to right, var(--tt-cyan) 50%, var(--tt-red) 50%); margin: 5px 0; }
        
        .live-info { position: absolute; top: 20px; left: 10px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
        .id-tag { background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 20px; font-size: 12px; }

        /* Menyu */
        .nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; border-top: 0.5px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .plus-btn { background: linear-gradient(to right, var(--tt-cyan), var(--tt-red)); padding: 2px 14px; border-radius: 8px; color: black; font-weight: bold; font-size: 22px; cursor: pointer; }

        .btn-action { background: var(--tt-red); border: none; color: white; padding: 10px 20px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>

<div id="homePage" class="page active-page">
    <div class="feed" id="videoFeed">
        </div>
</div>

<div id="livePage" class="page">
    <div id="liveContainer">
        <div class="live-info">
            <div class="id-tag" style="background:var(--tt-red)">CANLI</div>
            <div class="id-tag" id="myIdDisplay">ID: Yüklənir...</div>
        </div>
        
        <div class="video-grid">
            <div class="live-video"><video id="localVideo" autoplay playsinline muted></video></div>
            <div class="live-video"><video id="remoteVideo" class="remote" autoplay playsinline></video></div>
        </div>
        
        <div class="pk-bar"></div>

        <div style="padding: 20px; display: flex; gap: 10px; justify-content: center;">
            <input type="text" id="peerIdInput" placeholder="Dostunun ID-sini yaz" style="padding:10px; border-radius:20px; border:none; width:60%;">
            <button class="btn-action" style="background:var(--tt-cyan); color:black;" onclick="connectToPeer()">PK BAŞLAT</button>
            <button class="btn-action" onclick="endLive()">BİTİR</button>
        </div>
    </div>
</div>

<div class="nav">
    <span class="material-icons-round" onclick="showPage('homePage')">home</span>
    <span class="material-icons-round" onclick="initLive()">live_tv</span>
    <div class="plus-btn" onclick="alert('Video Redaktə Paneli Aktivdir!')">+</div>
    <span class="material-icons-round">message</span>
    <span class="material-icons-round">person</span>
</div>

<script>
    // 1. HAZIR VİDEOLAR (AUTO-SCROLL)
    const videos = [
        "https://v16m-default.akamaized.net/609090/video.mp4",
        "https://www.w3schools.com/html/mov_bbb.mp4",
        "https://www.w3schools.com/html/movie.mp4",
        "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-light-12859-large.mp4"
    ];

    const feed = document.getElementById('videoFeed');
    videos.forEach((src, i) => {
        feed.innerHTML += `
            <div class="v-card">
                <video src="${src}" loop playsinline onclick="this.play()"></video>
                <div style="position:absolute; bottom:80px; left:20px;">
                    <b>@user_${i+1}</b><br>
                    <span>EcoPix subtitr sınağı... [Subtitles Active]</span>
                </div>
            </div>`;
    });

    // 2. REAL P2P CANLI YAYIM (PeerJS)
    let peer;
    let localStream;

    function initLive() {
        showPage('livePage');
        peer = new Peer(); // Hər kəsə özəl ID verir

        peer.on('open', (id) => {
            document.getElementById('myIdDisplay').innerText = "Mənim ID: " + id;
            console.log('ID alındı: ' + id);
        });

        // Kameranı aç
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
        });

        // Zəng gələndə (Dostun sənə PK atanda)
        peer.on('call', (call) => {
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
        });
    }

    // DOSTA ZƏNG ET (PK BAŞLAT)
    function connectToPeer() {
        const remoteId = document.getElementById('peerIdInput').value;
        if (!remoteId) return alert("Dostunun ID-sini yaz!");

        const call = peer.call(remoteId, localStream);
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
        });
    }

    function endLive() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        showPage('homePage');
        location.reload();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
    }

    // Auto-Play Scroll
    feed.onscroll = () => {
        const vids = document.querySelectorAll('video');
        vids.forEach(v => {
            const r = v.getBoundingClientRect();
            if(r.top >= 0 && r.top < 300) v.play(); else v.pause();
        });
    };
</script>

</body>
</html>

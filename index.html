<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPix Live PK Pro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --tt-red: #fe2c55; --tt-cyan: #25f4ee; --glass: rgba(0,0,0,0.5); }
        body, html { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100%; }
        
        .page { display: none; height: 100vh; width: 100%; position: absolute; top: 0; }
        .active-page { display: block; }

        /* PK Rejimi - Ekranı iki yerə bölmək */
        .live-container { display: flex; flex-direction: column; height: 100vh; width: 100%; background: #000; }
        .video-box { flex: 1; position: relative; overflow: hidden; background: #111; border-bottom: 1px solid #333; transition: 0.5s; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        /* Canlı Yayım UI Elementləri */
        .live-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 100; }
        .id-label { background: var(--tt-red); padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 11px; }
        
        .music-btn { position: absolute; top: 60px; right: 10px; background: var(--glass); padding: 8px; border-radius: 50%; z-index: 100; cursor: pointer; }

        .live-overlay { position: absolute; bottom: 80px; left: 10px; z-index: 100; width: 280px; }
        .chat-list { height: 140px; overflow-y: hidden; display: flex; flex-direction: column-reverse; margin-bottom: 10px; pointer-events: none; }
        .msg-bubble { background: var(--glass); padding: 6px 12px; border-radius: 15px; margin-top: 5px; font-size: 13px; animation: fadeIn 0.3s; width: fit-content; }

        /* Animasiyalar */
        #heart-field { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
        .gift-anim { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; z-index: 1000; pointer-events: none; display: none; }

        /* Musiqi Paneli */
        .music-drawer { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1a1a1a; border-radius: 20px 20px 0 0; transition: 0.3s; z-index: 2000; padding: 20px; box-sizing: border-box; }
        .music-drawer.open { bottom: 0; }
        .m-item { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }

        /* Naviqasiya */
        .nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="livePage" class="page active-page">
    <div class="live-top">
        <div style="display:flex; flex-direction:column; gap:5px;">
            <div class="id-label" id="myIdDisplay">ID: Yüklənir...</div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="peerIdInput" placeholder="Dost ID" style="padding:5px; border-radius:5px; border:none; background:rgba(255,255,255,0.2); color:white; font-size:10px; width:100px;">
                <button onclick="connectToFriend()" style="background:var(--tt-cyan); border:none; border-radius:5px; padding:5px 10px; font-weight:bold; font-size:10px;">PK QOŞUL</button>
            </div>
        </div>
        <button onclick="location.reload()" style="background:var(--glass); border:none; color:white; padding:5px 15px; border-radius:20px;">Bitir</button>
    </div>

    <div class="music-btn" onclick="toggleMusicMenu()">
        <span class="material-icons-round">music_note</span>
    </div>

    <div class="live-container">
        <div class="video-box" id="localBox"><video id="localVideo" autoplay playsinline muted></video></div>
        <div class="video-box" id="remoteBox" style="display:none;"><video id="remoteVideo" autoplay playsinline></video></div>
    </div>

    <canvas id="heart-field"></canvas>
    <div id="shipAnim" class="gift-anim">🚢</div>
    <div id="roseAnim" class="gift-anim">🌹🌹🌹</div>

    <div class="live-overlay">
        <div class="chat-list" id="chatContainer"></div>
        <div style="display:flex; gap:5px; align-items:center;">
            <input type="text" id="msgInput" placeholder="Şərh yaz..." style="flex:1; padding:12px; border-radius:25px; border:2px solid orange; background:rgba(0,0,0,0.6); color:white;">
            <button onclick="sendLiveMsg()" style="background:var(--tt-red); border:none; border-radius:25px; padding:12px 20px; font-weight:bold;">Göndər</button>
        </div>
        <div style="display:flex; gap:15px; margin-top:15px;">
            <button onclick="sendGift('🌹')" style="background:none; border:none; font-size:30px;">🌹</button>
            <button onclick="sendGift('👑')" style="background:none; border:none; font-size:30px;">👑</button>
            <button onclick="sendGift('🚢')" style="background:none; border:none; font-size:30px;">🚢</button>
            <button onclick="spawnHearts()" style="background:var(--tt-red); border:none; border-radius:50%; width:45px; height:45px; margin-left:auto;"><span class="material-icons-round">favorite</span></button>
        </div>
    </div>
</div>

<div id="musicMenu" class="music-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;"><h3>Musiqi Seçimi</h3> <span class="material-icons-round" onclick="toggleMusicMenu()">close</span></div>
    <div class="m-item" onclick="playMusic(1)"><span>🎵 Viral Remix 2024</span> <span class="material-icons-round">play_arrow</span></div>
    <div class="m-item" onclick="playMusic(2)"><span>🎵 Bass Booster PK</span> <span class="material-icons-round">play_arrow</span></div>
    <div class="m-item" onclick="playMusic(3)"><span>🎵 Sad Violin (Emotional)</span> <span class="material-icons-round">play_arrow</span></div>
    <div class="m-item" onclick="playMusic(4)"><span>🎵 Azerbaijan Pop Mix</span> <span class="material-icons-round">play_arrow</span></div>
    <button onclick="stopMusic()" style="width:100%; margin-top:15px; padding:10px; border-radius:10px; background:none; color:white; border:1px solid #444;">Durdur</button>
    <audio id="bgMusic" loop></audio>
</div>

<script>
    let peer, conn, localStream;
    const canvas = document.getElementById('heart-field');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 1. CANLI YAYIMI VƏ SƏSİ BAŞLAT
    async function startLive() {
        peer = new Peer();
        peer.on('open', id => document.getElementById('myIdDisplay').innerText = "ID: " + id);

        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', rStream => {
                const rBox = document.getElementById('remoteBox');
                rBox.style.display = 'block';
                document.getElementById('remoteVideo').srcObject = rStream;
            });
        });

        peer.on('connection', c => {
            conn = c;
            setupConn();
        });
    }

    function connectToFriend() {
        const friendId = document.getElementById('peerIdInput').value;
        if(!friendId) return alert("Dost ID daxil et!");
        
        conn = peer.connect(friendId);
        setupConn();
        
        const call = peer.call(friendId, localStream);
        call.on('stream', rStream => {
            document.getElementById('remoteBox').style.display = 'block';
            document.getElementById('remoteVideo').srcObject = rStream;
        });
    }

    function setupConn() {
        conn.on('data', data => {
            if(data.type === 'chat') addChat(data.user, data.msg);
            if(data.type === 'gift') showGiftAnim(data.gift);
            if(data.type === 'hearts') spawnHearts();
        });
    }

    // 2. ŞƏRH SİSTEMİ
    function sendLiveMsg() {
        const inp = document.getElementById('msgInput');
        if(inp.value.trim()) {
            addChat('Mən', inp.value);
            if(conn) conn.send({ type: 'chat', user: 'Dostun', msg: inp.value });
            inp.value = '';
        }
    }

    function addChat(user, msg) {
        const container = document.getElementById('chatContainer');
        const div = document.createElement('div');
        div.className = 'msg-bubble';
        div.innerHTML = `<b>${user}:</b> ${msg}`;
        container.prepend(div);
    }

    // 3. MUSİQİ İDARƏSİ
    function toggleMusicMenu() { document.getElementById('musicMenu').classList.toggle('open'); }
    function playMusic(id) {
        const tracks = [
            "",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
        ];
        const audio = document.getElementById('bgMusic');
        audio.src = tracks[id];
        audio.play();
        toggleMusicMenu();
        addChat('Sistem', 'Musiqi başladıldı 🎵');
    }
    function stopMusic() { document.getElementById('bgMusic').pause(); toggleMusicMenu(); }

    // 4. HƏDİYYƏ VƏ ÜRƏK ANİMASİYALARI
    function sendGift(type) {
        showGiftAnim(type);
        if(conn) conn.send({ type: 'gift', gift: type });
    }

    function showGiftAnim(type) {
        let elId = type === '🚢' ? 'shipAnim' : (type === '🌹' ? 'roseAnim' : null);
        if(!elId) return alert(type + " göndərildi!");
        
        const el = document.getElementById(elId);
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    let heartList = [];
    function spawnHearts() {
        for(let i=0; i<10; i++) {
            heartList.push({ x: window.innerWidth - 50, y: window.innerHeight - 150, vX: (Math.random()-0.5)*5, vY: -Math.random()*5-2, a: 1 });
        }
        if(conn && arguments.length === 0) conn.send({ type: 'hearts' });
        animateHearts();
    }

    function animateHearts() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        heartList.forEach((h, i) => {
            h.x += h.vX; h.y += h.vY; h.a -= 0.01;
            ctx.globalAlpha = h.a;
            ctx.fillStyle = '#fe2c55';
            ctx.font = '24px Arial';
            ctx.fillText('❤️', h.x, h.y);
            if(h.a <= 0) heartList.splice(i, 1);
        });
        if(heartList.length > 0) requestAnimationFrame(animateHearts);
    }

    startLive();
</script>
</body>
</html>

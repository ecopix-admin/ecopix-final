<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çayxana Ultra - Canlı Səsli Otaqlar</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --accent: #00f2ff; --bg: #09090b; --card: #18181b; --live: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }

        /* HEADER & SEARCH */
        .header { background: #000; padding: 10px 15px; border-bottom: 1px solid #222; }
        .search-box { display: flex; gap: 10px; margin-top: 10px; }
        .search-box input { flex: 1; background: #111; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; color: white; outline: none; font-size: 13px; }
        
        /* VOICE STATUS BAR */
        .voice-status { background: #111; padding: 5px 15px; font-size: 11px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #222; }
        .live-dot { width: 8px; height: 8px; background: var(--live); border-radius: 50%; animation: blink 1s infinite; display: none; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }

        /* STAGE */
        .stage { width: 100%; height: 28vh; background: #000; position: relative; }
        iframe, video { width: 100%; height: 100%; border: none; display: none; }
        .active { display: block !important; }

        /* CHAT */
        .chat { height: calc(72vh - 200px); overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: var(--card); padding: 10px; border-radius: 12px; max-width: 85%; border: 1px solid #27272a; position: relative; }
        .msg b { display: block; font-size: 10px; color: var(--accent); margin-bottom: 4px; }
        .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* FOOTER */
        .tools { position: fixed; bottom: 0; width: 100%; background: #000; padding: 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #222; }
        .tools input { flex: 1; background: #18181b; border: none; padding: 12px; border-radius: 20px; color: white; outline: none; }
        .icon-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; background: #222; border: none; color: white; }
        .btn-voice.active { background: var(--live); color: white; box-shadow: 0 0 15px var(--live); }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <b id="myNick" onclick="setNick()" style="color: var(--accent);">Ləqəb Təyin Et</b>
            <span id="roomName" style="font-size: 12px; color: #888;">Lobby</span>
        </div>
        <div class="search-box">
            <input type="text" id="roomSearch" placeholder="Otaq adı yazın...">
            <button class="icon-btn" onclick="joinRoom()"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <div class="voice-status">
        <div id="liveDot" class="live-dot"></div>
        <span id="voiceMsg">Səsli söhbət: Deaktiv</span>
    </div>

    <div class="stage">
        <iframe id="yt" allow="autoplay"></iframe>
        <video id="tv" controls autoplay muted></video>
    </div>

    <div class="chat" id="chat"></div>

    <div id="remote-audios"></div> <div class="tools">
        <label for="fileInp" class="icon-btn"><i class="fas fa-paperclip"></i></label>
        <input type="file" id="fileInp" style="display:none" onchange="uploadFile(this)">
        
        <input type="text" id="msgInp" placeholder="Mesaj yazın...">
        
        <button class="icon-btn" id="voiceBtn" onclick="toggleVoiceRoom()"><i class="fas fa-microphone"></i></button>
        <button class="icon-btn" style="background: var(--accent); color: #000;" onclick="sendText()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script>
        const conf = { apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8", databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app", projectId: "ecopix-118c6" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let nick = localStorage.getItem('v_nick') || "User_" + Math.floor(Math.random()*9999);
        let room = localStorage.getItem('v_room') || "Lobby";
        document.getElementById('myNick').innerText = nick;
        document.getElementById('roomName').innerText = "Otaq: " + room;

        // PeerJS Setup (Kollektiv Səsli Söhbət)
        const peer = new Peer(nick.replace(/\s+/g, '_') + "_" + room);
        let myStream;

        async function toggleVoiceRoom() {
            const btn = document.getElementById('voiceBtn');
            const dot = document.getElementById('liveDot');
            const msg = document.getElementById('voiceMsg');

            if (!myStream) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    btn.classList.add('active');
                    dot.style.display = 'block';
                    msg.innerText = "Səsli söhbət: AKTİV (Hər kəs sizi eşidir)";
                    
                    // Otaqdakı aktiv istifadəçiləri tap və onlara "zəng" et
                    db.ref(`rooms/${room}/active_speakers`).once('value', s => {
                        s.forEach(child => {
                            if(child.key !== nick) {
                                const call = peer.call(child.key.replace(/\s+/g, '_') + "_" + room, myStream);
                                call.on('stream', remoteStream => playRemoteAudio(remoteStream, child.key));
                            }
                        });
                    });
                    db.ref(`rooms/${room}/active_speakers/${nick}`).set(true);
                } catch (e) { alert("Mikrofon icazəsi verilmədi!"); }
            } else {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
                btn.classList.remove('active');
                dot.style.display = 'none';
                msg.innerText = "Səsli söhbət: Deaktiv";
                db.ref(`rooms/${room}/active_speakers/${nick}`).remove();
            }
        }

        peer.on('call', call => {
            if(myStream) {
                call.answer(myStream);
                call.on('stream', remoteStream => playRemoteAudio(remoteStream, call.peer));
            }
        });

        function playRemoteAudio(stream, id) {
            if(document.getElementById('audio-'+id)) return;
            const audio = document.createElement('audio');
            audio.id = 'audio-' + id;
            audio.srcObject = stream;
            audio.autoplay = true;
            document.getElementById('remote-audios').append(audio);
        }

        // MESAJ SİSTEMİ & 1 SAATLIQ SİLMƏ
        function sendText() {
            let i = document.getElementById('msgInp');
            if(i.value) {
                db.ref(`rooms/${room}/msgs`).push({ user: nick, text: i.value, type: 'text', timestamp: Date.now() });
                i.value = "";
            }
        }

        db.ref(`rooms/${room}/msgs`).on('child_added', snap => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<b>${d.user}</b>${d.type === 'text' ? d.text : (d.type === 'image' ? `<img src="${d.url}"><br><a href="${d.url}" download style="color:var(--accent); font-size:12px;">Endir</a>` : `<video src="${d.url}" controls></video>`)}`;
            document.getElementById('chat').append(div);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        });

        // 1 Saatlıq Avtomatik Silmə (Real vaxtda)
        setInterval(() => {
            const limit = Date.now() - (3600 * 1000);
            db.ref(`rooms/${room}/msgs`).orderByChild('timestamp').endAt(limit).once('value', s => {
                s.forEach(c => c.ref.remove());
            });
        }, 60000);

        function setNick() { let n = prompt("Ləqəb:", nick); if(n) { localStorage.setItem('v_nick', n); location.reload(); } }
        function joinRoom() { let r = document.getElementById('roomSearch').value; if(r) { localStorage.setItem('v_room', r); location.reload(); } }
        
        // Fayl Yükləmə (Cloudinary)
        async function uploadFile(input) {
            const file = input.files[0]; if(!file) return;
            const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', 'ml_default');
            const res = await fetch(`https://api.cloudinary.com/v1_1/dyrfkit3x/auto/upload`, { method: 'POST', body: fd });
            const data = await res.json();
            db.ref(`rooms/${room}/msgs`).push({ user: nick, url: data.secure_url, type: file.type.startsWith('image') ? 'image' : 'video', timestamp: Date.now() });
        }
    </script>
</body>
</html>

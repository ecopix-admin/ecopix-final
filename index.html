<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Çayxana PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f1012; --card: #1c1d21; --accent: #00d2ff; --tea: #e67e22; --text: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

        /* GİRİŞ EKRANI (LOBBY) */
        #lobby { position: fixed; inset: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .logo-area { font-size: 50px; margin-bottom: 10px; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .user-chip { background: var(--accent); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(0,210,255,0.3); margin-bottom: 30px; }

        /* ƏSAS TƏTBİQ STRUKTURU */
        .app-shell { display: none; display: flex; flex-direction: column; height: 100vh; position: relative; }
        
        /* Video Bölməsi (Üst) */
        .video-fixed { width: 100%; height: 35vh; background: #000; position: relative; border-bottom: 2px solid #222; }
        iframe { width: 100%; height: 100%; border: none; }
        .remote { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 5px; z-index: 10; opacity: 0.5; transition: 0.3s; }
        .remote:hover { opacity: 1; }
        .remote input { background: rgba(0,0,0,0.8); border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 11px; width: 120px; }

        /* Onlayn Paneli */
        .status-bar { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; font-size: 12px; border: 1px solid var(--accent); display: flex; align-items: center; gap: 8px; z-index: 100; }
        .dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 10px #2ecc71; }

        /* Çat Bölməsi (Orta) */
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(to bottom, #0f1012, #16171a); }
        .msg-bubble { background: var(--card); padding: 12px 16px; border-radius: 18px 18px 18px 4px; max-width: 85%; align-self: flex-start; border: 1px solid #2a2a2a; }
        .msg-bubble b { display: block; font-size: 11px; color: var(--accent); margin-bottom: 4px; text-transform: uppercase; }
        .gift-card { background: rgba(230, 126, 34, 0.1); border: 1px dashed var(--tea); color: var(--tea); align-self: center; text-align: center; width: 90%; }

        /* Səs Pleyeri */
        .voice-box { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--accent); }
        .voice-wave { height: 20px; width: 60px; background: url('https://i.stack.imgur.com/idB98.png') repeat-x; filter: hue-rotate(180deg); }

        /* Alətlər Paneli (Alt) */
        .bottom-nav { height: 80px; background: #1a1b1e; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: 1px solid #2a2a2a; }
        input#msgInput { flex: 1; background: #26272b; border: none; padding: 14px 20px; border-radius: 30px; color: white; outline: none; font-size: 15px; }
        .btn-round { width: 48px; height: 48px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 18px; }
        .btn-send { background: var(--accent); color: #000; }
        .btn-voice { background: #333; color: #fff; }
        .btn-voice.recording { background: #ff4757; animation: pulse 1s infinite; }
        .btn-tea { background: var(--tea); color: #fff; }

        /* Animasiyalar */
        #tea-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 2000; display: none; align-items: center; justify-content: center; font-size: 150px; background: rgba(0,0,0,0.4); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="logo-area">☕</div>
        <h2 style="margin-bottom: 5px;">Virtual Çayxana</h2>
        <p style="color: #666; margin-bottom: 30px;">Professional Sosial Məkan</p>
        <div id="my-id-display" class="user-chip" onclick="changeName()">ID Yüklənir...</div>
        <button onclick="enterApp()" style="background: none; border: 2px solid #333; color: white; padding: 12px 40px; border-radius: 10px; font-weight: bold; cursor: pointer;">Daxil Ol</button>
    </div>

    <div class="app-shell" id="app" style="display: none;">
        <div id="tea-overlay">☕</div>
        <div class="status-bar"><div class="dot"></div> Onlayn: <span id="online-count">1</span></div>
        
        <div class="video-fixed">
            <div class="remote">
                <input type="text" id="vID" placeholder="YouTube Video ID">
                <button onclick="syncVideo()" style="border:none; background:var(--accent); border-radius:3px; padding:0 5px;"><i class="fas fa-play"></i></button>
            </div>
            <iframe id="player" src="" allow="autoplay"></iframe>
        </div>

        <div class="chat-area" id="chatbox"></div>

        <div class="bottom-nav">
            <input type="text" id="msgInput" placeholder="Mesaj yazın...">
            <button class="btn-round btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
            <button class="btn-round btn-voice" id="recBtn"><i class="fas fa-microphone"></i></button>
            <button class="btn-round btn-tea" onclick="giveTea()"><i class="fas fa-mug-hot"></i></button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyCtrVliO1bmdg7r0juWz-Yj2EaEGNsz2j8",
            databaseURL: "https://ecopix-118c6-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ecopix-118c6"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        let user = localStorage.getItem('v_name') || "Qonaq_" + Math.floor(1000 + Math.random()*9000);
        localStorage.setItem('v_name', user);
        document.getElementById('my-id-display').innerText = user;

        function changeName() {
            let n = prompt("Yeni ləqəbiniz:", user);
            if(n) { user = n.substring(0,12); localStorage.setItem('v_name', user); location.reload(); }
        }

        function enterApp() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            initApp();
        }

        function initApp() {
            // Onlayn Sistemi
            const pRef = db.ref('online/' + user);
            pRef.set(true); pRef.onDisconnect().remove();
            db.ref('online').on('value', s => { document.getElementById('online-count').innerText = s.val() ? Object.keys(s.val()).length : 0; });

            // Video Sinxron
            db.ref('current_v').on('value', s => {
                let id = s.val() || "j_SInXN2Fas";
                document.getElementById('player').src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&playlist=${id}&loop=1`;
            });

            // Çatı Dinlə
            db.ref('msgs').limitToLast(25).on('child_added', snap => {
                const d = snap.val();
                const div = document.createElement('div');
                div.className = d.type === 'tea' ? 'msg-bubble gift-card' : 'msg-bubble';
                
                if(d.type === 'voice') {
                    div.innerHTML = `<b>${d.user}</b><div class="voice-box" onclick="new Audio('${d.url}').play()"><i class="fas fa-play-circle"></i> <div class="voice-wave"></div></div>`;
                } else if(d.type === 'tea') {
                    div.innerHTML = `☕ ${d.text}`;
                    showTea();
                } else {
                    div.innerHTML = `<b>${d.user}</b>${d.text}`;
                }
                document.getElementById('chatbox').appendChild(div);
                document.getElementById('chatbox').scrollTop = document.getElementById('chatbox').scrollHeight;
            });
        }

        function sendMsg() {
            const i = document.getElementById('msgInput');
            if(i.value) { db.ref('msgs').push({ user, text: i.value, type: 'text' }); i.value = ""; }
        }

        function syncVideo() {
            const id = document.getElementById('vID').value;
            if(id) db.ref('current_v').set(id);
        }

        function giveTea() { db.ref('msgs').push({ user, text: `${user} hamıya çay qonaq etdi!`, type: 'tea' }); }

        function showTea() {
            const o = document.getElementById('tea-overlay');
            o.style.display = 'flex'; setTimeout(() => o.style.display = 'none', 2500);
        }

        // CLOUDINARY SƏS YAZMA
        let recorder; let chunks = [];
        const btn = document.getElementById('recBtn');

        btn.onmousedown = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const fd = new FormData();
                fd.append('file', blob);
                fd.append('upload_preset', 'ml_default');
                const res = await fetch('https://api.cloudinary.com/v1_1/dyrfkit3x/video/upload', { method: 'POST', body: fd });
                const r = await res.json();
                if(r.secure_url) db.ref('msgs').push({ user, url: r.secure_url, type: 'voice' });
            };
            recorder.start(); btn.classList.add('recording');
        };
        btn.onmouseup = () => { recorder.stop(); btn.classList.remove('recording'); };
        
        document.getElementById("msgInput").onkeyup = e => { if(e.key === "Enter") sendMsg(); };
    </script>
</body>
</html>

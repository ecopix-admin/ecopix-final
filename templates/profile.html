<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - EcoPix</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        .header { padding: 40px 20px; border-bottom: 1px solid #222; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 10px; }
        .grid-item { background: #111; aspect-ratio: 9/16; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="header">
        <div style="width: 80px; height: 80px; background: #333; border-radius: 50%; margin: 0 auto;"></div>
        <h3>@{{ user.username if user else 'İstifadəçi' }}</h3>
        <p>0 İzləyici · 0 Bəyənmə</p>
    </div>
    <div class="grid">
        {% for video in videos %}
        <div class="grid-item">
            <video src="{{ video.video_url }}"></video>
        </div>
        {% endfor %}
    </div>
</body>
</html>

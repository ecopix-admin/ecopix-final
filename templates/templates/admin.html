<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPix Admin</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; }
        button { background: #00f2ea; color: black; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>EcoPix Admin Paneli</h2>
    <form action="/admin_panel" method="POST">
        <label>Reklam Kodu (Adsterra və s.):</label>
        <textarea name="ad_html" rows="5" placeholder="Reklam kodunu bura yapışdır"></textarea>
        <button type="submit">Sistemi Yenilə</button>
    </form>
    <br>
    <p><a href="/" style="color: #ccc;">🏠 Ana Səhifəyə Qayıt</a></p>
</body>
</html>

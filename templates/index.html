<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPix</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        .video-container { height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; }
        .video-card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .side-bar { position: absolute; right: 10px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; }
        .icon { font-size: 30px; text-align: center; cursor: pointer; text-shadow: 2px 2px 5px #000; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; padding: 15px 0; border-top: 0.5px solid #333; }
    </style>
</head>
<body>
    <div class="video-container">
        {% if videos %}
            {% for video in videos %}
            <div class="video-card">
                <video src="{{ video.video_url }}" loop onclick="this.paused ? this.play() : this.pause()"></video>
                <div class="side-bar">
                    <div class="icon">❤️<br><small>{{ video.likes or 0 }}</small></div>
                    <div class="icon">💬</div>
                    <div class="icon">🔗</div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div style="padding: 20px; text-align: center;"><h1>Hələ video yoxdur</h1><p>Admin paneldən əlavə edin.</p></div>
        {% endif %}
    </div>
    <div class="nav"><span>🏠</span><span>🔍</span><span style="font-size:24px; background:#fff; color:#000; padding:0 10px; border-radius:5px;">+</span><span>📥</span><span>👤</span></div>
</body>
</html>

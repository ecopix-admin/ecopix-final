<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPix - TikTok Style</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        .video-container { height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; }
        .video-card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #111; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .side-bar { position: absolute; right: 10px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .icon { font-size: 30px; text-align: center; cursor: pointer; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
        .info { position: absolute; left: 15px; bottom: 100px; z-index: 10; text-shadow: 1px 1px 3px #000; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; padding: 15px 0; border-top: 0.5px solid #333; z-index: 20; }
        .add-btn { background: #fff; color: #000; padding: 2px 12px; border-radius: 8px; font-weight: bold; font-size: 24px; }
    </style>
</head>
<body>
    <div class="video-container">
        {% if videos %}
            {% for video in videos %}
            <div class="video-card">
                <video src="{{ video.video_url }}" loop onclick="this.paused ? this.play() : this.pause()"></video>
                <div class="side-bar">
                    <div class="icon">❤️<br><small>{{ video.likes or 0 }}</small></div>
                    <div class="icon">💬<br><small>0</small></div>
                    <div class="icon">🔗</div>
                </div>
                <div class="info">
                    <b>@{{ video.username or 'istifadeci' }}</b>
                    <p>{{ video.caption }}</p>
                    <span>🎵 {{ video.music or 'Orijinal səs' }}</span>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div style="padding: 50px; text-align: center;">
                <h2>Hələ ki video yoxdur.</h2>
                <p>İlk videonu yükləmək üçün Admin Panelinə keçin.</p>
            </div>
        {% endif %}
    </div>

    <div class="nav-bottom">
        <span>🏠</span>
        <span>🔍</span>
        <span class="add-btn">+</span>
        <span>📥</span>
        <span>👤</span>
    </div>

    <script>
        // Avtomatik oynatma dəstəyi
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.play();
                    else entry.target.pause();
                });
            }, { threshold: 0.5 });
            videos.forEach(v => observer.observe(v));
        });
    </script>
</body>
</html>

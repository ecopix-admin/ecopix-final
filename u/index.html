<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPanel Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; }
        body { font-family: 'Inter', sans-serif; background: #050505; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px; overflow-x: hidden; }
        
        /* Sarı Bildiriş */
        .alert-bar { background: #ffcc00; color: black; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 15px; width: 90%; max-width: 400px; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }

        /* Video / Reklam Sahəsi */
        .promo-video { width: 100%; max-width: 400px; border-radius: 15px; border: 1px solid var(--neon-blue); overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        video { width: 100%; display: block; }
        .ad-text { font-size: 12px; margin-top: 5px; color: #888; }
        .ad-btn { background: none; border: 1px solid #444; color: #aaa; padding: 5px 10px; border-radius: 20px; font-size: 11px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 15px; }

        /* Səs Düyməsi Dizaynı */
        .sound-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; border: 1px solid var(--neon-blue); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }

        /* Profil Kartı */
        .profile-card { background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 30px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        h1 { font-size: 26px; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-blue); }

        /* Sosial Düymələr */
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        .link-btn { display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 15px; text-decoration: none; color: white; font-weight: 600; transition: 0.3s; font-size: 15px; }
        .link-btn i { margin-right: 10px; font-size: 18px; }
        .link-btn:hover { transform: scale(1.03); filter: brightness(1.2); }

        /* Rənglər */
        .tiktok { background: #000; border: 1px solid #fff; }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .youtube { background: #FF0000; }
        .whatsapp { background: #25D366; }
        .facebook { background: #1877F2; }
        .telegram { background: #0088cc; }
        .vkontakte { background: #0077FF; }
        .rutube { background: #000; border: 1px solid #4E4E4E; }
        .odnoklassniki { background: #ee8208; }
        .website { background: #444; }

        /* Bot Düyməsi və Ox */
        .bot-section { margin-top: 30px; position: relative; }
        .create-btn { background: var(--neon-purple); color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-block; box-shadow: 0 0 20px var(--neon-purple); animation: pulse 2s infinite; }
        .hand-icon { display: inline-block; font-size: 24px; animation: pointing 1s infinite alternate; vertical-align: middle; margin-right: 10px; }

        @keyframes pointing { from { transform: translateX(0); } to { transform: translateX(-10px); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(188, 19, 254, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(188, 19, 254, 0); } 100% { box-shadow: 0 0 0 0 rgba(188, 19, 254, 0); } }

        /* Məxfilik Modal */
        #policy-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: #111; border: 1px solid var(--neon-blue); padding: 20px; border-radius: 15px; color: #ccc; line-height: 1.6; }
        .close-btn { background: var(--neon-blue); color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .policy-trigger { margin-top: 20px; font-size: 12px; color: #555; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="alert-bar" id="alert-text">Yüklənir...</div>

    <div class="promo-video">
        <video id="promoVid" autoplay muted loop playsinline poster="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=400&auto=format&fit=crop">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <button onclick="toggleSound()" class="sound-btn">
            <i class="fas fa-volume-mute" id="soundIcon"></i>
        </button>
    </div>
    <div class="ad-text" id="ad-info">Reklamınız burada ola bilər!</div>
    <a href="https://t.me/shamkhal_h" class="ad-btn" id="ad-btn">Müraciət edin</a>

    <div class="profile-card">
        <h1 id="user-name">...</h1>
        <div class="links-container" id="links"></div>

        <div class="bot-section">
            <span class="hand-icon">👉</span>
            <a href="https://t.me/BioPanelBot" class="create-btn" id="create-btn">Öz Bio Panelini Yarat</a>
        </div>

        <div class="policy-trigger" onclick="openPolicy()" id="policy-label">Məxfilik Siyasəti</div>
    </div>

    <div id="policy-modal">
        <div class="modal-content">
            <h2 id="policy-title">...</h2>
            <div id="policy-text">...</div>
            <button class="close-btn" onclick="closePolicy()" id="close-label">Bağla</button>
        </div>
    </div>

    <script>
        // Səs funksiyası
        function toggleSound() {
            const vid = document.getElementById("promoVid");
            const icon = document.getElementById("soundIcon");
            if (vid.muted) {
                vid.muted = false;
                icon.classList.remove("fa-volume-mute");
                icon.classList.add("fa-volume-up");
            } else {
                vid.muted = true;
                icon.classList.remove("fa-volume-up");
                icon.classList.add("fa-volume-mute");
            }
        }

        const translations = {
            'az': { alert: "⚠ Əgər birbaşa açılmırsa, sağdakı ( • • • ) klikləyin və 'Brauzerdə aç' seçin.", ad_info: "Reklamınız burada ola bilər!", ad_btn: "Müraciət edin", create: "Öz Bio Panelini Yarat", policy: "Məxfilik Siyasəti", close: "Bağla", policy_t: "Hüquqi Qorunma və Məxfilik", policy_b: "1. Bu xidmət fərdi məlumatların qorunması qanunvericiliyinə uyğun fəaliyyət göstərir. 2. İstifadəçi tərəfindən daxil edilən bütün linklər açıq mənbə hesab olunur. 3. BioPanel administrasiyası yerləşdirilən keçidlərin məzmununa görə məsuliyyət daşımır. 4. Qeyri-qanuni və ya etik olmayan məzmunlar aşkar edildikdə dərhal silinir. 5. Xidmətdən istifadə etməklə siz bütün şərtləri qəbul etmiş olursunuz." },
            'tr': { alert: "⚠ Doğrudan açılmıyorsa, sağ üstteki ( • • • ) dokunun ve 'Tarayıcıda aç' deyin.", ad_info: "Reklamınız burada olabilir!", ad_btn: "Başvuru yapın", create: "Kendi Bio Panelinizi Oluşturun", policy: "Gizlilik Politikası", close: "Kapat", policy_t: "Yasal Koruma ve Gizlilik", policy_b: "Bu hizmet gönüllü kullanım içindir. Tüm sorumluluk kullanıcıya aittir." },
            'ru': { alert: "⚠ Если не открывается, нажмите ( • • • ) и выберите 'Открыть в браузере'.", ad_info: "Ваша реклама может быть здесь!", ad_btn: "Связаться", create: "Создать свой Био Панель", policy: "Политика конфиденциальности", close: "Закрыть", policy_t: "Юридическая защита", policy_b: "Пользуясь сервисом, вы принимаете условия хранения ссылок." },
            'en': { alert: "⚠ If it doesn't open, click ( • • • ) and select 'Open in Browser'.", ad_info: "Your ad could be here!", ad_btn: "Contact us", create: "Create Your Own Bio Panel", policy: "Privacy Policy", close: "Close", policy_t: "Legal Notice", policy_b: "By using this service, you agree to the terms and conditions." },
            'de': { alert: "⚠ Wenn es nicht öffnet, klicken Sie auf ( • • • ) und wählen Sie 'Im Browser öffnen'.", ad_info: "Ihre Werbung hier!", ad_btn: "Kontakt", create: "Erstellen Sie Ihr Bio-Panel", policy: "Datenschutz", close: "Schließen", policy_t: "Rechtliche Hinweise", policy_b: "Nutzung erfolgt auf eigene Gefahr." }
        };

        const lang = navigator.language.split('-')[0] || 'en';
        const t = translations[lang] || translations['en'];

        document.getElementById('alert-text').innerText = t.alert;
        document.getElementById('ad-info').innerText = t.ad_info;
        document.getElementById('ad-btn').innerText = t.ad_btn;
        document.getElementById('create-btn').innerText = t.create;
        document.getElementById('policy-label').innerText = t.policy;
        document.getElementById('policy-title').innerText = t.policy_t;
        document.getElementById('policy-text').innerText = t.policy_b;
        document.getElementById('close-label').innerText = t.close;

        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('user');

        if (user) {
            fetch(`data/${user}.json`).then(r => r.json()).then(data => {
                document.getElementById('user-name').innerText = data.name;
                const container = document.getElementById('links');
                const platforms = [
                    {id:'tiktok', n:'TikTok', i:'fa-tiktok'}, {id:'instagram', n:'Instagram', i:'fa-instagram'},
                    {id:'youtube', n:'YouTube', i:'fa-youtube'}, {id:'whatsapp', n:'WhatsApp', i:'fa-whatsapp'},
                    {id:'facebook', n:'Facebook', i:'fa-facebook'}, {id:'telegram', n:'Telegram', i:'fa-telegram'},
                    {id:'vkontakte', n:'VKontakte', i:'fa-vk'}, {id:'rutube', n:'RuTube', i:'fa-play'},
                    {id:'odnoklassniki', n:'Odnoklassniki', i:'fa-odnoklassniki'}, {id:'website', n:'Website', i:'fa-globe'}
                ];
                platforms.forEach(p => {
                    if (data[p.id] && data[p.id].toLowerCase() !== 'no') {
                        const a = document.createElement('a');
                        a.href = data[p.id].startsWith('http') ? data[p.id] : `https://${data[p.id]}`;
                        a.className = `link-btn ${p.id}`;
                        a.innerHTML = `<i class="fab ${p.icon}"></i> ${p.n}`;
                        a.target = "_blank";
                        container.appendChild(a);
                    }
                });
            });
        }

        function openPolicy() { document.getElementById('policy-modal').style.display = 'block'; }
        function closePolicy() { document.getElementById('policy-modal').style.display = 'none'; }
    </script>
</body>
</html>

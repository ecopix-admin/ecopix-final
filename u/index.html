<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Panel Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 90%; max-width: 400px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; padding-bottom: 20px; }
        .ad-section { background: #eee; width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 5px solid #007bff; }
        .ad-section img { width: 100%; height: 100%; object-fit: cover; }
        .profile-pic { width: 100px; height: 100px; background: #007bff; border: 5px solid white; border-radius: 50%; margin-top: -50px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: bold; position: relative; z-index: 2; }
        h1 { margin: 10px 0; color: #333; }
        .links { padding: 0 20px; }
        .btn { display: none; align-items: center; justify-content: center; padding: 12px; margin: 10px 0; border-radius: 10px; text-decoration: none; color: white; font-weight: bold; transition: 0.3s; }
        .tiktok { background: #000; } .insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .yt { background: #ff0000; } .wa { background: #25d366; } .fb { background: #1877f2; } .web { background: #444; }
        #loading { padding: 50px; font-weight: bold; color: #888; }
        .footer { margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div class="ad-section">
        <img src="https://via.placeholder.com/400x200?text=Sizin+Reklamınız+Burada" alt="Reklam">
    </div>

    <div class="profile-pic" id="initials">..</div>
    
    <h1 id="userName">Yüklənir...</h1>
    
    <div id="loading">Məlumatlar gətirilir...</div>

    <div class="links" id="linkBox">
        <a id="tiktok" class="btn tiktok" href="#"><i class="fab fa-tiktok"></i> &nbsp; TikTok</a>
        <a id="insta" class="btn insta" href="#"><i class="fab fa-instagram"></i> &nbsp; Instagram</a>
        <a id="yt" class="btn yt" href="#"><i class="fab fa-youtube"></i> &nbsp; YouTube</a>
        <a id="wa" class="btn wa" href="#"><i class="fab fa-whatsapp"></i> &nbsp; WhatsApp</a>
        <a id="fb" class="btn fb" href="#"><i class="fab fa-facebook"></i> &nbsp; Facebook</a>
        <a id="web" class="btn web" href="#"><i class="fas fa-globe"></i> &nbsp; Vebsayt</a>
    </div>

    <div class="footer">
        POWERED BY BIOPANEL CREATOR
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user');

    if (user) {
        // GitHub-dan istifadəçinin JSON faylını çəkirik
        fetch(`https://raw.githubusercontent.com/ecopix-admin/ecopix-final/main/u/data/${user}.json`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('userName').innerText = data.name;
                document.getElementById('initials').innerText = data.name.charAt(0).toUpperCase();

                // Linkləri yoxla və aktiv et
                const platforms = ['tiktok', 'insta', 'yt', 'wa', 'fb', 'web'];
                platforms.forEach(p => {
                    if (data[p] && data[p].toLowerCase() !== 'yox') {
                        let link = data[p];
                        if (p === 'wa' && !link.startsWith('http')) link = `https://wa.me/${link.replace('+', '')}`;
                        const el = document.getElementById(p);
                        el.href = link;
                        el.style.display = 'flex';
                    }
                });
            })
            .catch(err => {
                document.getElementById('loading').innerText = "İstifadəçi tapılmadı!";
            });
    } else {
        document.getElementById('loading').innerText = "Zəhmət olmasa linkə düzgün daxil olun.";
    }
</script>

</body>
</html>
